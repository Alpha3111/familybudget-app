<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilyBudget Accounting V5</title></head><body><div id="status" style="font-family:system-ui;padding:30px">Chargement de FamilyBudget…</div><script>
(async()=>{try{const files=['payload-v5/p01.b64','payload-v5/p02.b64','payload-v5/p03.b64','payload-v5/p04.b64','payload-v5/p05.b64','payload-v5/p06.b64','payload-v5/p07.b64','payload-v5/p08.b64','payload-v5/p09.b64','payload-v5/p10.b64','payload-v5/p11.b64'];const chunks=await Promise.all(files.map(async f=>{const r=await fetch(f+'?v=5');if(!r.ok)throw new Error(f+' '+r.status);return (await r.text()).trim()}));const raw=atob(chunks.join(''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('status').innerHTML='<h2>Erreur de chargement</h2><p>'+String(e.message||e)+'</p><p>Recharge avec Ctrl+Shift+R.</p>'}})();
</script></body></html>
