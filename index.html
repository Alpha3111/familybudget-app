<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>FamilyBudget Accounting V5</title>
<style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:#111}#status{padding:32px 20px;max-width:720px;margin:auto}#status h2{margin-top:18px}</style>
</head>
<body>
<div id="status">Chargement de FamilyBudget…</div>
<script>
(async()=>{
  try{
    const files=[
      'payload-v5/p01.b64','payload-v5/p02.b64','payload-v5/p03.b64',
      'payload-v5/p04.b64','payload-v5/p05.b64','payload-v5/p06.b64',
      'payload-v5/p07.b64','payload-v5/p08.b64','payload-v5/p09.b64',
      'payload-v5/p10.b64','payload-v5/p11.b64'
    ];
    const pieces=[];
    for(const f of files){
      const r=await fetch(f+'?v=10',{cache:'no-store'});
      if(!r.ok)throw new Error(f+' : HTTP '+r.status);
      const txt=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');
      if(!txt.length||txt.length%4!==0)throw new Error(f+' : fragment Base64 invalide ('+txt.length+' caractères)');
      let bin;
      try{bin=atob(txt)}catch(err){throw new Error(f+' : décodage Base64 impossible')}
      pieces.push(Uint8Array.from(bin,c=>c.charCodeAt(0)));
    }
    const total=pieces.reduce((n,p)=>n+p.length,0);
    const bytes=new Uint8Array(total);
    let off=0;
    for(const p of pieces){bytes.set(p,off);off+=p.length}
    if(typeof DecompressionStream==='undefined')throw new Error('Ce navigateur ne supporte pas la décompression nécessaire.');
    let html;
    try{
      html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    }catch(err){
      throw new Error('Payload Accounting V5 compressé invalide');
    }
    if(!html.includes('accountingModelV5'))throw new Error('La version Accounting V5 n’a pas été reconnue');

    html=html.replace(/<meta name="viewport" content="[^"]*">/i,'<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">');
    html=html.replace('</head>','<meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="stylesheet" href="mobile.css?v=3"></head>');
    const mobileScript='<scr'+'ipt src="mobile.js?v=3"></scr'+'ipt>';
    html=html.replace('</body>',mobileScript+'</body>');

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error(e);
    const box=document.getElementById('status');
    if(box)box.innerHTML='<h2>Erreur de chargement</h2><p>'+String(e.message||e)+'</p><p>Recharge simplement la page.</p>';
  }
})();
</script>
</body>
</html>
