async function cloudCheckRemote({initial=false,manual=false}={}){
  if(!cloud.user||!cloud.docRef||!cloud.authorized)return;
  // Ne jamais interrompre un menu, un champ ou une fenêtre que l'utilisateur manipule.
  if(!initial&&!manual&&userIsInteracting())return;

  try{
    const snap=await cloud.docRef.get();

    if(!snap.exists){
      if(initial&&HAD_LOCAL_STATE&&hasMeaningfulLocalState()){
        await cloudPushNow(true)
      }
      cloud.status='online';
      updateCloudUI();
      return
    }

    const data=snap.data()||{},remote=data.state||{},rh=sharedHash(remote),remoteAt=data.updatedAtClient||'';

    if(initial){
      cloud.initialResolved=true;
      const localAt=(()=>{try{return localStorage.getItem(CLOUD_SHARED_CHANGED_KEY)||''}catch(e){return''}})();

      if(!HAD_LOCAL_STATE||!localAt||(remoteAt&&remoteAt>=localAt)){
        cloud.applyingRemote=true;
        cloud.lastHash=rh;
        persistRemoteLocally(remote,remoteAt);
        cloud.applyingRemote=false;
      }else{
        await cloudPushNow(true)
      }
      cloud.status='online';
      updateCloudUI();
      return
    }

    // S'il existe une vraie modification locale pas encore envoyée, ne jamais l'écraser.
    const localHash=sharedHash(sharedStateSnapshot());
    if(cloud.lastHash&&localHash!==cloud.lastHash){
      return
    }

    if(rh&&rh!==cloud.lastHash){
      cloud.applyingRemote=true;
      cloud.lastHash=rh;
      persistRemoteLocally(remote,remoteAt);
      cloud.applyingRemote=false;
      cloud.status='online';
      updateCloudUI();
      // Pas de toast répétitif : le changement est appliqué silencieusement.
    }else{
      cloud.status='online';
      updateCloudUI()
    }
  }catch(e){
    cloud.status='error';
    cloud.error=e.message||String(e);
    updateCloudUI()
  }
}

function connectCloudDocument(){
  if(!cloud.user||!cloud.db)return;

  cloud.status='connecting';
  cloud.error='';
  cloud.authorized=true;
  updateCloudUI();

  if(cloud.unsubscribe)cloud.unsubscribe();

  cloud.docRef=cloud.db.collection('households')
    .doc(String(cloud.settings.householdId))
    .collection('app')
    .doc('budget');

  // Fonction de nettoyage compatible avec l'ancien mécanisme unsubscribe.
  cloud.unsubscribe=()=>{
    if(cloud.pollTimer)clearInterval(cloud.pollTimer);
    cloud.pollTimer=null
  };

  // Un seul chargement au démarrage.
  cloudCheckRemote({initial:true}).then(()=>{
    // Puis seulement une vérification par minute.
    if(cloud.pollTimer)clearInterval(cloud.pollTimer);
    cloud.pollTimer=setInterval(()=>cloudCheckRemote(),60000)
  })
}
function scheduleCloudSave(){
  const h=noteLocalSharedChange();
  if(!cloud.user||!cloud.docRef||!cloud.authorized||cloud.applyingRemote)return;
  if(h===cloud.lastHash)return;
  clearTimeout(cloud.saveTimer);
  // Une seule synchronisation après la modification, une fois que l'utilisateur a fini son action.
  cloud.saveTimer=setTimeout(()=>cloudPushNow(false),1500)
}
async function cloudPushNow(silent=false){
  if(!cloud.user||!cloud.docRef||!cloud.authorized){

  const payload=sharedStateSnapshot(),h=sharedHash(payload);
  cloud.status='syncing';
  updateCloudUI();

    const now=new Date().toISOString();
    await cloud.docRef.set({
      state:payload,
      updatedAtClient:now,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy:cloud.user.uid
    },{merge:true});
    cloud.lastHash=h;
    try{
      localStorage.setItem(CLOUD_SHARED_HASH_KEY,h);
      localStorage.setItem(CLOUD_SHARED_CHANGED_KEY,now)
    }catch(e){}
    cloud.status='online';
    updateCloudUI();
    if(!silent)toast('Sauvegardé et synchronisé')
  }catch(e){
    cloud.status='error';
    cloud.error=e.message||String(e);
    updateCloudUI();
    if(!silent)toast('Échec de la synchronisation','error')
  }
}

function applyKnownCorrections(s){
  if(!s||typeof s!=='object')return s;
  s.depenses=Array.isArray(s.depenses)?s.depenses:[];
  s.echeancier=Array.isArray(s.echeancier)?s.echeancier:[];
  s._corrections=(s._corrections&&typeof s._corrections==='object')?s._corrections:{};

  // ---------------- V3 : assurances séparées + montant variable ----------------
  if(!s._corrections.echeancierRealityV3){
    // Les prélèvements Primmum identifiés dans les données sont des assurances auto.
    for(const x of s.depenses){
      if(normDesc(x.Description).includes('primmum insurance')){
        x.Categorie='Assurance auto';
        if(!x.Type||x.Type==='Dépense')x.Type='Fixe';
      }
    }

    // Électricité : rappel conservé, sans faux montant prévu.
    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n==='electricite'||n.includes('enmax')||n.includes('carma')){
        d.Montant=null;
        d.MontantVariable=true;
        d.MatchMerchant='carma webrecurr';
        d.Categorie=d.Categorie||'Maison';
      }
    }

    const hasTucson=s.echeancier.some(d=>normDesc(d.Nom).includes('assurance tucson'));
    const hasTown=s.echeancier.some(d=>/assurance town( and| &)? country/.test(normDesc(d.Nom))||normDesc(d.Nom).includes('assurance town country'));
    const oldIdx=s.echeancier.findIndex(d=>{
      const n=normDesc(d.Nom);
      return n==='assurance auto'&&!n.includes('tucson')&&!n.includes('town');
    });

    const primmum=s.depenses
      .filter(x=>normDesc(x.Description).includes('primmum insurance')&&Number(x.Montant)>0)
      .map(x=>({amount:Number(x.Montant),date:String(x.Date||''),day:Number(String(x.Date||'').slice(8,10))||0}))
      .sort((a,b)=>b.amount-a.amount);

    const distinct=[];
    for(const p of primmum){
      if(!distinct.some(q=>Math.abs(q.amount-p.amount)<=0.02))distinct.push(p);
    }
    const high=distinct[0]||null,low=distinct[1]||null;

    if(oldIdx>=0&&(!hasTucson||!hasTown)){
      const old=s.echeancier[oldIdx];
      const base={...old,Paiements:{},Categorie:'Assurance auto',Frequence:old.Frequence||'Mensuel',Alerte:''};
      const items=[];
      if(!hasTucson)items.push({
        ...base,
        id:`${old.id||'ech-assurance-auto'}-tucson`,
        Nom:'Assurance Tucson',
        Montant:high?high.amount:null,
        MontantVariable:!high,
        Jour:high?.day||Number(old.Jour)||7,
        MatchRole:'primmum-high',
        MatchMerchant:'primmum insurance'
      });
      if(!hasTown)items.push({
        ...base,
        id:`${old.id||'ech-assurance-auto'}-town-country`,
        Nom:'Assurance Town & Country',
        Montant:low?low.amount:null,
        MontantVariable:!low,
        Jour:low?.day||(high?.day?Math.min(28,high.day+10):17),
        MatchRole:'primmum-low',
        MatchMerchant:'primmum insurance'
      });
      s.echeancier.splice(oldIdx,1,...items);
    }

    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n.includes('assurance tucson')){
        d.MatchRole='primmum-high';d.MatchMerchant='primmum insurance';d.Categorie='Assurance auto';
        if((d.Montant===null||d.Montant===''||d.Montant===undefined)&&high){d.Montant=high.amount;d.MontantVariable=false}
      }
      if(n.includes('assurance town')&&n.includes('country')){
        d.MatchRole='primmum-low';d.MatchMerchant='primmum insurance';d.Categorie='Assurance auto';
        if((d.Montant===null||d.Montant===''||d.Montant===undefined)&&low){d.Montant=low.amount;d.MontantVariable=false}
      }
    }
    s._corrections.echeancierRealityV3=true;
  }

  // ---------------- V4 : corrections basées sur les libellés bancaires réels ----------------
  if(!s._corrections.echeancierRealityV4){

    // A) Loyer : le vrai libellé bancaire est DPA Mainstreet Equi.
    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n==='loyer'||n.startsWith('loyer ')){
        d.MatchMerchant='mainstreet equi';
        d.Categorie='Loyer';
      }
    }

    // B) Électricité : le vrai libellé est CARMA WEBRECURR.
    //    Le montant reste volontairement vide/variable.
    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n==='electricite'||n.includes('carma')||n.includes('enmax')){
        d.Nom='Électricité';
        d.Montant=null;
        d.MontantVariable=true;
        d.MatchMerchant='carma webrecurr';
        d.Categorie='Maison';
      }
    }
    for(const x of s.depenses){
      if(normDesc(x.Description).includes('carma webrecurr')){
        x.Categorie='Maison';
        x.Type='Fixe';
      }
    }

    // C) Prêt auto : 353 $ correspond au Town & Country (le van).
    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n==='pret auto'||n.includes('pret auto van')||n.includes('pret auto town')){
        d.Nom='Prêt auto Town & Country';
        d.Montant=353;
        d.MontantVariable=false;
        d.Type='Fixe';
      }
    }

    // D) Prêt étudiant Alberta : 52,31 $, commence à la fin d'août 2026.
    let alberta=s.echeancier.find(d=>normDesc(d.Nom).includes('pret etudiant alberta'));
    if(!alberta){
      alberta={
        id:uid('ech'),
        Nom:'Prêt étudiant Alberta',
        Montant:52.31,
        Jour:30,
        Frequence:'Mensuel',
        Alerte:'',
        Paiements:{},
        Type:'Fixe',
        DebutMois:'2026-08'
      };
      s.echeancier.push(alberta);
    }else{
      alberta.Nom='Prêt étudiant Alberta';
      alberta.Montant=52.31;
      alberta.MontantVariable=false;
      alberta.Jour=30;
      alberta.Frequence=alberta.Frequence||'Mensuel';
      alberta.Type='Fixe';
      alberta.DebutMois='2026-08';
    }
    // Supprimer d'éventuels doublons Alberta.
    let seenAlberta=false;
    s.echeancier=s.echeancier.filter(d=>{
      if(!normDesc(d.Nom).includes('pret etudiant alberta'))return true;
      if(!seenAlberta){seenAlberta=true;return true}
      return false;
    });

    // E) Assurances : Tucson = Primmum la plus élevée, Town & Country = la seconde.
    //    L'ancienne "Assurance habitation 269 $" provenait d'un mauvais classement
    //    de la transaction Primmum : on la retire pour éviter un doublon.
    const primmumAmounts=s.depenses
      .filter(x=>normDesc(x.Description).includes('primmum insurance')&&Number(x.Montant)>0)
      .map(x=>Number(x.Montant))
      .filter(Number.isFinite)
      .sort((a,b)=>b-a);
    const uniquePrimmum=[];
    for(const a of primmumAmounts)if(!uniquePrimmum.some(b=>Math.abs(a-b)<=0.02))uniquePrimmum.push(a);
    const tucsonAmt=uniquePrimmum[0]||269;
    const townAmt=uniquePrimmum[1]||157.42;

    // Retirer uniquement la ligne historique de 269 $ faussement appelée assurance habitation.
    s.echeancier=s.echeancier.filter(d=>{
      const n=normDesc(d.Nom);
      return !(n==='assurance habitation'&&Math.abs(Number(d.Montant||0)-269)<=0.02);
    });

    let tucson=s.echeancier.find(d=>normDesc(d.Nom).includes('assurance tucson'));
    if(!tucson){
      tucson={id:uid('ech'),Nom:'Assurance Tucson',Montant:tucsonAmt,Jour:7,Frequence:'Mensuel',Alerte:'',Paiements:{},Type:'Fixe'};
      s.echeancier.push(tucson);
    }
    tucson.Nom='Assurance Tucson';
    tucson.Montant=tucsonAmt;
    tucson.MontantVariable=false;
    tucson.Categorie='Assurance auto';
    tucson.MatchRole='primmum-high';
    tucson.MatchMerchant='primmum insurance';

    let town=s.echeancier.find(d=>normDesc(d.Nom).includes('assurance town')&&normDesc(d.Nom).includes('country'));
    if(!town){
      town={id:uid('ech'),Nom:'Assurance Town & Country',Montant:townAmt,Jour:17,Frequence:'Mensuel',Alerte:'',Paiements:{},Type:'Fixe'};
      s.echeancier.push(town);
    }
    town.Nom='Assurance Town & Country';
    town.Montant=townAmt;
    town.MontantVariable=false;
    town.Categorie='Assurance auto';

          if(Math.abs(sum3-amount)<=.02){const sc=trio.reduce((z,x)=>z+x.score,0);if(sc>comboScore){combo=trio;comboScore=sc}}
        }
      }
      if(combo){const matched=combo.map(x=>x.exp);matched.forEach(x=>used.add(x.id));result.set(due.id,matchResult(matched,'auto',comboScore));continue}
    }

    result.set(due.id,{paid:!!entry.manualPaid,manualPaid:!!entry.manualPaid,matchedExpenseId:null,matchedExpenseIds:[],actualPaid:entry.manualPaid?duePlannedAmount(due):0,source:entry.manualPaid?'manual':'',score:0});
  }
  return result
}

function dueStatusInfo(x,dateStr){
  const today=new Date();today.setHours(0,0,0,0);
  const currentMonth=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  const [yy,mm,dd]=String(dateStr).split("-").map(Number),due=new Date(yy,mm-1,dd);due.setHours(0,0,0,0);
  const diff=Math.round((due-today)/86400000);
  let status="",statusClass="";
  if(x.paye){status=x._paymentSource==='manual'?"Payé (manuel)":"Payé";statusClass="green"}
  else if(state.selectedMonth<currentMonth){status="À vérifier";statusClass="amber"}
  else if(state.selectedMonth>currentMonth){status=diff<=7?"À payer bientôt":"À venir";statusClass=diff<=7?"amber":"blue"}
  else if(diff<0){status="À vérifier";statusClass="amber"}
  else if(diff===0){status="Échéance aujourd’hui";statusClass="amber"}
  else if(diff<=7){status="À payer bientôt";statusClass="amber"}
  else{status="À venir";statusClass="blue"}
  let note=String(x.Alerte||"").trim();
  if(/^(A PAYER BIENTOT|À PAYER BIENTÔT|Cette semaine)$/i.test(note))note="";
  return {_daysRemaining:diff,_status:status,_statusClass:statusClass,_note:note};
}
function upcoming(){
  const reconciliation=reconcileDueMonth(state.selectedMonth);
  return state.echeancier.filter(x=>dueAppliesToMonth(x,state.selectedMonth)).map(x=>{
    const r=reconciliation.get(x.id)||{paid:false,manualPaid:false,matchedExpenseId:null,matchedExpenseIds:[],actualPaid:0,source:''};
    const row={...x,paye:r.paid,_date:dueDateForMonth(x,state.selectedMonth),_paymentSource:r.source,_matchedExpenseId:r.matchedExpenseId,_matchedExpenseIds:r.matchedExpenseIds||[],_actualPaid:Number(r.actualPaid||0),_manualPaid:r.manualPaid};
    return {...row,...dueStatusInfo(row,row._date)}
  }).sort((a,b)=>{if(Boolean(a.paye)!==Boolean(b.paye))return a.paye?1:-1;return a._date.localeCompare(b._date)});
}

  <div class="quick-import-grid"><div class="quick-import"><span class="import-priority">✓ Recommandé</span><h3>1. Fichier de transactions</h3><p class="tiny">Formats : <span class="format-chip">CSV</span><span class="format-chip">OFX</span><span class="format-chip">QFX</span><span class="format-chip">QBO</span><span class="format-chip">PDF</span><span class="format-chip">JPG/PNG</span></p><div id="bankDrop" class="dropzone" data-action="choose-bank-file" style="margin-top:10px;padding:20px 14px"><div class="drop-icon">⇩</div><h3>Déposer le fichier bancaire</h3><p>Les fichiers structurés sont lus directement. Les PDF texte sont lus sans OCR; l’OCR n’est utilisé que si nécessaire.</p><button class="btn primary" type="button" data-action="choose-bank-file">Choisir un fichier</button></div></div><div class="quick-import"><span class="import-priority">✓ Très pratique</span><h3>2. Copier-coller les opérations</h3><p class="tiny">Depuis le site bancaire, sélectionne les lignes de transactions visibles, copie-les puis colle-les ici. L’application tente d’identifier automatiquement date, description et montant.</p><textarea id="bankPasteText" class="field" placeholder="Exemple :\n14 Aug  TIM HORTONS  10.30\n15 Aug  PAYROLL  1,929.51 CR"></textarea><div class="paste-actions"><button class="btn accent" data-action="analyse-pasted-bank">Analyser le texte</button><button class="btn" data-action="paste-clipboard-bank">Coller depuis le presse-papiers</button></div><div class="tiny" style="margin-top:7px">Le presse-papiers peut nécessiter une autorisation du navigateur.</div></div></div>
  <div class="bank-hero" style="margin-top:14px"><div class="panel"><span class="import-priority fallback">Solution de secours</span><h3 style="margin-top:0">Photo / screenshot / PDF scanné</h3><p class="privacy-note">Toujours disponible, mais l’OCR peut confondre une date, un solde et un montant. Les transactions détectées restent donc dans l’écran de validation avant ajout.</p><div class="bank-status"><div style="display:flex;justify-content:space-between;gap:10px"><strong id="bankStatusText">${esc(b.message||'Prêt à analyser')}</strong><span id="bankProgressText" class="muted">${Math.round(b.progress||0)} %</span></div><div class="bank-progress"><span id="bankProgressBar" style="width:${Math.round(b.progress||0)}%"></span></div></div></div><div class="panel"><h3 style="margin-top:0">Paramètres d’import</h3><div class="bank-config"><div><label class="lbl">Type de compte</label><select id="bankAccountType" class="field"><option value="bank" ${b.accountType==='bank'?'selected':''}>Compte bancaire / débit</option><option value="credit" ${b.accountType==='credit'?'selected':''}>Carte de crédit</option></select></div><div><label class="lbl">Mois de référence</label><input id="bankStatementMonth" type="month" class="field" value="${esc(b.statementMonth||state.selectedMonth)}"></div><div class="span2"><label class="lbl">Nom du compte</label><input id="bankAccountName" class="field" value="${esc(b.accountName||'Compte bancaire')}" placeholder="Ex. RBC Chèque Sihem, VISA Infinite Commune"></div></div><p class="privacy-note"><strong>Confidentialité :</strong> les fichiers sont traités dans ton navigateur. Les données bancaires ne sont pas envoyées à un serveur par cette application. Le module OCR externe n’est chargé que pour lire une image ou une page scannée.</p></div></div>
  ${cs.length?bankResultsView(cs,selected,dup,low):`<div class="bank-empty bank-results">Aucune transaction préparée. Utilise de préférence un CSV/OFX/QFX ou le copier-coller; garde l’image/PDF scanné comme solution de secours.</div>`}
  ${b.rawText?`<details class="raw-box"><summary>Voir le texte brut extrait (${Math.round(b.rawText.length/100)/10} k caractères)</summary><pre>${esc(b.rawText.slice(0,30000))}${b.rawText.length>30000?'\n… texte tronqué dans cet aperçu …':''}</pre></details>`:''}
  </section>`
}

function bankCandidateRow(x,i){

function settingsView(c){const cats=state.categories.map(cat=>`<div class="catline"><div><input class="field" data-cat-name="${esc(cat)}" value="${esc(cat)}"></div><div><input class="field" type="number" min="0" step="1" data-budget="${esc(cat)}" value="${Number(state.budgets[cat]||0)}"></div><button class="btn small danger" data-delete-cat="${esc(cat)}">Suppr.</button></div>`).join('');return `<section class="section settings-grid"><div class="panel"><div class="section-title">Réglages du mois</div><div class="section-sub">Ces valeurs servent aux calculs du tableau de bord</div><div style="margin-top:12px"><label class="lbl">Revenus mensuels planifiés — ${esc(monthName(state.selectedMonth))}</label><div style="display:flex;gap:8px"><input id="incomePlanSetting" class="field" type="number" min="0" step="0.01" value="${incomePlan()}"><button class="btn primary" data-action="save-income-plan">Enregistrer</button></div></div><div style="margin-top:14px"><div class="summaryline"><span>Dépenses fixes + variables</span><strong>${money(c.spend)}</strong></div><div class="summaryline"><span>Transferts / épargne</span><strong>${money(c.transfers)}</strong></div><div class="summaryline total"><span>Solde planifié</span><strong class="${c.remaining>=0?'green-text':'danger-text'}">${money(c.remaining)}</strong></div></div><div class="section-title" style="margin-top:18px">Synchronisation</div><div class="list" style="margin-top:8px"><button class="btn" data-action="cloud-settings">☁ Configurer / vérifier le budget partagé</button></div><div class="section-title" style="margin-top:18px">Données</div><div class="list" style="margin-top:8px"><button class="btn" data-action="export">Exporter une sauvegarde JSON</button><button class="btn" data-action="export-csv">Exporter les dépenses du mois en CSV</button><button class="btn" data-action="clear-paid">Effacer les coches manuelles de ${esc(monthName(state.selectedMonth))}</button><button class="btn danger" data-action="reset">Réinitialiser les données d’origine</button></div></div><div class="panel"><div class="section-head"><div><div class="section-title">Catégories et budgets</div><div class="section-sub">Change le nom ou le budget directement dans les champs</div></div><button class="btn primary" data-action="new-category">+ Catégorie</button></div><div><div class="catline"><strong>Catégorie</strong><strong>Budget</strong><span></span></div>${cats}</div><div class="tiny" style="margin-top:10px">Les changements de nom sont appliqués aussi aux transactions existantes.</div></div></section>`}
function renderModal(){if(!ui.modal)return'';let title='',body='';if(ui.modal==='expense'){const x=state.depenses.find(v=>v.id===ui.editId)||{Date:defaultDate(),Description:'',Montant:'',Categorie:state.categories[0]||'Maison',Compte:'Visa Infinite',Type:'Dépense',Cycle:cycleForDate(defaultDate())};title=ui.editId?'Modifier la dépense':'Nouvelle dépense';body=expenseForm(x)}else if(ui.modal==='income'){const x=state.revenus.find(v=>v.id===ui.editId)||{Source:'',Montant:'',Frequence:'Mensuel',Jour:'',ProchaineDate:defaultDate(),Statut:'À recevoir',Cycle:cycleForDate(defaultDate()),Note:''};title=ui.editId?'Modifier le revenu':'Nouveau revenu';body=incomeForm(x)}else if(ui.modal==='envelope'){const x=state.enveloppes.find(v=>v.id===ui.editId)||{Enveloppe:'',Objectif:'',Deja:0,ParMois:0,ParCycle:0,Notes:''};title=ui.editId?'Modifier l’enveloppe':'Nouvelle enveloppe';body=envelopeForm(x)}else if(ui.modal==='due'){const x=state.echeancier.find(v=>v.id===ui.editId)||{Nom:'',Montant:'',Jour:1,Frequence:'Mensuel',Alerte:'',DebutMois:state.selectedMonth,FinMois:''};title=ui.editId?'Modifier l’échéance':'Nouvelle échéance';body=dueForm(x)}else if(ui.modal==='due-review'){const x=state.echeancier.find(v=>v.id===ui.editId);if(!x){ui.modal=null;return''}title='Vérifier le paiement';body=dueReviewForm(x)}else if(ui.modal==='category'){title='Nouvelle catégorie';body=categoryForm()}else if(ui.modal==='cloud'){title='Synchronisation du budget';body=cloudForm()}return `<div class="modal-back" data-action="close-modal"><div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="modal-head"><h2>${title}</h2><button class="close" data-action="close-modal" aria-label="Fermer">×</button></div>${body}</div></div>`}
function defaultDate(){const [y,m]=state.selectedMonth.split('-').map(Number);const now=new Date();const d=(now.getFullYear()===y&&now.getMonth()+1===m)?now.getDate():1;return `${state.selectedMonth}-${String(d).padStart(2,'0')}`}
function expenseForm(x){const cats=[...state.categories];if(!cats.includes('Santé'))cats.push('Santé');const accounts=['Visa Infinite','Débit Walid','Débit Sihem'];const accountOptions=ui.editId&&x.Compte&&!accounts.includes(x.Compte)?[x.Compte,...accounts]:accounts;return `<form id="expenseForm"><div class="formgrid"><div><label class="lbl">Date</label><input name="Date" class="field" type="date" value="${esc(x.Date)}" required></div><div><label class="lbl">Montant</label><input name="Montant" class="field" type="number" min="0.01" step="0.01" value="${esc(x.Montant)}" required></div><div class="span2"><label class="lbl">Description</label><input name="Description" class="field" value="${esc(x.Description)}" required autofocus></div><div><label class="lbl">Catégorie</label><select name="Categorie" class="field">${cats.map(c=>`<option ${x.Categorie===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label class="lbl">Type</label><select name="Type" class="field">${['Dépense','Fixe','Transfert','Remboursement'].map(t=>`<option ${x.Type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="lbl">Cycle</label><select name="Cycle" class="field">${['Cycle 01-14','Cycle 15-29'].map(t=>`<option ${x.Cycle===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label class="lbl">Compte</label><select name="Compte" class="field">${accountOptions.map(a=>`<option ${x.Compte===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div></div><div class="actions">${ui.editId?'<button type="button" class="btn danger" data-action="delete-expense">Supprimer</button>':''}<button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">${ui.editId?'Enregistrer':'Ajouter'}</button></div></form>`}
function incomeForm(x){return `<form id="incomeForm"><div class="formgrid"><div class="span2"><label class="lbl">Source</label><input name="Source" class="field" value="${esc(x.Source)}" required></div><div><label class="lbl">Montant</label><input name="Montant" class="field" type="number" min="0.01" step="0.01" value="${esc(x.Montant)}" required></div><div><label class="lbl">Date</label><input name="ProchaineDate" class="field" type="date" value="${esc(String(x.ProchaineDate).slice(0,10))}" required></div><div><label class="lbl">Fréquence</label><input name="Frequence" class="field" value="${esc(x.Frequence||'Mensuel')}"></div><div><label class="lbl">Statut</label><select name="Statut" class="field"><option ${x.Statut==='À recevoir'?'selected':''}>À recevoir</option><option ${x.Statut==='Reçu'?'selected':''}>Reçu</option></select></div><div><label class="lbl">Cycle</label><select name="Cycle" class="field"><option ${String(x.Cycle).includes('01-14')?'selected':''}>Cycle 01-14</option><option ${String(x.Cycle).includes('15-29')?'selected':''}>Cycle 15-29</option></select></div><div><label class="lbl">Jour / note courte</label><input name="Jour" class="field" value="${esc(x.Jour||'')}"></div><div class="span2"><label class="lbl">Note</label><textarea name="Note" class="field" rows="2">${esc(x.Note||'')}</textarea></div></div><div class="actions">${ui.editId?'<button type="button" class="btn danger" data-action="delete-income">Supprimer</button>':''}<button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`}
function envelopeForm(x){return `<form id="envelopeForm"><div class="formgrid"><div class="span2"><label class="lbl">Nom</label><input name="Enveloppe" class="field" value="${esc(x.Enveloppe)}" required></div><div><label class="lbl">Objectif</label><input name="Objectif" class="field" type="number" min="0" step="0.01" value="${esc(x.Objectif)}"></div><div><label class="lbl">Déjà épargné</label><input name="Deja" class="field" type="number" min="0" step="0.01" value="${esc(x.Deja)}"></div><div><label class="lbl">Par mois</label><input name="ParMois" class="field" type="number" min="0" step="0.01" value="${esc(x.ParMois||0)}"></div><div><label class="lbl">Par cycle / paie</label><input name="ParCycle" class="field" type="number" min="0" step="0.01" value="${esc(x.ParCycle||0)}"></div><div class="span2"><label class="lbl">Date cible (optionnel)</label><input name="DateCible" class="field" type="date" value="${esc(x.DateCible||'')}"></div><div class="span2"><label class="lbl">Notes</label><textarea name="Notes" class="field" rows="2">${esc(x.Notes||'')}</textarea></div></div><div class="actions">${ui.editId?'<button type="button" class="btn danger" data-action="delete-envelope">Supprimer</button>':''}<button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`}
function dueForm(x){
  const legacy=dueLegacySpecialMonth(x),start=String(x.DebutMois||legacy||''),end=String(x.FinMois||legacy||''),amount=dueHasPlannedAmount(x)?x.Montant:'';
  return `<form id="dueForm"><div class="formgrid"><div class="span2"><label class="lbl">Nom</label><input name="Nom" class="field" value="${esc(x.Nom)}" required></div><div><label class="lbl">Montant prévu (facultatif)</label><input name="Montant" class="field" type="number" min="0" step="0.01" value="${esc(amount)}" placeholder="Laisser vide si variable"><div class="tiny">Si tu laisses vide, le rappel reste actif mais aucun faux montant n’est ajouté au prévu.</div></div><div><label class="lbl">Jour du mois</label><input name="Jour" class="field" type="number" min="1" max="31" value="${esc(x.Jour)}"></div><div><label class="lbl">Fréquence</label><input name="Frequence" class="field" value="${esc(x.Frequence||'Mensuel')}"></div><div><label class="lbl">Alerte / note</label><input name="Alerte" class="field" value="${esc(x.Alerte||'')}"></div><div><label class="lbl">Actif à partir de</label><input name="DebutMois" class="field" type="month" value="${esc(start)}"><div class="tiny">Laisse vide si l’échéance existait déjà avant les mois enregistrés.</div></div><div><label class="lbl">Jusqu’à (optionnel)</label><input name="FinMois" class="field" type="month" value="${esc(end)}"><div class="tiny">Utile pour une échéance propre à un seul mois.</div></div></div><div class="actions">${ui.editId?'<button type="button" class="btn danger" data-action="delete-due">Supprimer</button>':''}<button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Enregistrer</button></div></form>`
}
function dueReviewForm(due){
  const candidates=dueReviewCandidates(due,state.selectedMonth),hasAmount=dueHasPlannedAmount(due);
  const rows=candidates.map(({exp,diff,nameScore,sameCat,merchantMatch})=>{
    const badges=[
      hasAmount&&diff!==null&&diff<=.02?'<span class="badge green">montant exact</span>':'',
      !hasAmount&&merchantMatch?'<span class="badge green">commerçant reconnu</span>':'',
      nameScore>=4?'<span class="badge blue">nom proche</span>':'',
      sameCat?'<span class="badge violet">même catégorie</span>':''
    ].filter(Boolean).join(' ');
    return `<div class="item"><div class="item-main"><div class="item-title">${esc(exp.Description)}</div><div class="item-sub">${dateFr(exp.Date)} • ${esc(exp.Categorie||'Sans catégorie')} • ${esc(exp.Compte||'')}</div>${badges?`<div style="margin-top:5px">${badges}</div>`:''}</div><div class="right money"><strong>${money(exp.Montant)}</strong></div><button type="button" class="btn small primary" data-use-due-expense="${exp.id}" data-due-id="${due.id}">Associer</button></div>`
  }).join('');

  return `<div class="alert blue"><strong>${esc(due.Nom)} — ${hasAmount?money(due.Montant):'montant variable'}</strong><div class="tiny" style="margin-top:4px">Aucune transaction n’a été reconnue avec assez de certitude. Vérifie avant de créer quoi que ce soit.</div></div><div style="margin-top:14px"><div class="section-title">Transactions possibles en ${esc(monthName(state.selectedMonth))}</div><div class="list" style="margin-top:8px">${rows||'<div class="empty">Aucune transaction ressemblante trouvée dans les dépenses de ce mois.</div>'}</div></div>${!hasAmount?`<div style="margin-top:12px"><label class="lbl">Montant réel si tu veux créer la dépense</label><input id="dueReviewAmount" class="field" type="number" min="0.01" step="0.01" placeholder="Ex. 137,42"></div>`:''}<div class="actions" style="flex-wrap:wrap"><button type="button" class="btn" data-action="due-review-expenses">Voir toutes les dépenses</button><button type="button" class="btn" data-action="due-review-manual">Payé sans créer de dépense</button><button type="button" class="btn primary" data-action="due-review-create">Créer la dépense</button></div><div class="tiny" style="margin-top:8px">« Voir toutes les dépenses » ferme cette fenêtre et ouvre directement les dépenses du mois sélectionné.</div>`
}
function categoryForm(){return `<form id="categoryForm"><div class="formgrid"><div class="span2"><label class="lbl">Nom</label><input name="name" class="field" required autofocus></div><div><label class="lbl">Budget mensuel</label><input name="budget" class="field" type="number" min="0" step="1" value="100"></div><div><label class="lbl">Couleur</label><input name="color" class="field" type="color" value="#10b981" style="height:40px;padding:4px"></div></div><div class="actions"><button type="button" class="btn" data-action="close-modal">Annuler</button><button class="btn primary" type="submit">Ajouter</button></div></form>`}
function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;ui.duplicateOnly=false;render();saveState()});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=(e)=>action(b.dataset.action,e,b));
  document.querySelectorAll('[data-edit-expense]').forEach(x=>x.onclick=()=>openModal('expense',x.dataset.editExpense));
  document.querySelectorAll('[data-edit-income]').forEach(x=>x.onclick=()=>openModal('income',x.dataset.editIncome));
  document.querySelectorAll('[data-edit-envelope]').forEach(x=>x.onclick=()=>openModal('envelope',x.dataset.editEnvelope));
  document.querySelectorAll('[data-edit-due]').forEach(x=>x.onclick=()=>openModal('due',x.dataset.editDue));
  document.querySelectorAll('[data-pay]').forEach(x=>x.onchange=()=>handleDueToggle(x.dataset.pay,x.checked));
  document.querySelectorAll('[data-use-due-expense]').forEach(x=>x.onclick=()=>{linkExpenseToDue(x.dataset.dueId,x.dataset.useDueExpense,state.selectedMonth);ui.modal=null;ui.editId=null;commit('Dépense associée à l’échéance')});
  document.querySelectorAll('[data-add-envelope]').forEach(b=>b.onclick=()=>{const id=b.dataset.addEnvelope,inp=document.querySelector(`#envamt-${CSS.escape(id)}`),amt=Number(inp.value);if(!(amt>0))return toast('Entre un montant supérieur à 0','error');const x=state.enveloppes.find(v=>v.id===id);if(x){x.Deja=Number(x.Deja||0)+amt;x.Reste=Math.max(0,Number(x.Objectif||0)-x.Deja);commit(`${money(amt)} ajouté à ${x.Enveloppe}`)}});
  document.querySelectorAll('[data-catjump]').forEach(x=>x.onclick=()=>{state.activeTab='depenses';ui.category=x.dataset.catjump;render();saveState()});
  document.querySelectorAll('[data-sort]').forEach(x=>x.onclick=()=>{const k=x.dataset.sort;if(ui.sort===k)ui.sortDir=ui.sortDir==='asc'?'desc':'asc';else{ui.sort=k;ui.sortDir=k==='Date'?'desc':'asc'}render()});
  const mi=document.querySelector('#monthInput');if(mi)mi.onchange=()=>{state.selectedMonth=mi.value;ui.search='';ui.category='Toutes';ui.duplicateOnly=false;commit()};

async function extractPdfText(file,onProgress){

function ofxTag(block,tag){const m=String(block).match(new RegExp(`<${tag}>([^<\\r\\n]+)`,`i`));return m?m[1].trim():''}
function parseOfxDate(v){const m=String(v||'').match(/(20\d{2})(\d{2})(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:''}
function parseBankOfx(text,source){const blocks=String(text||'').match(/<STMTTRN>[\s\S]*?(?=<STMTTRN>|<\/BANKTRANLIST>|<\/CCSTMTRS>|$)/gi)||[];const out=[];for(const b of blocks){const date=parseOfxDate(ofxTag(b,'DTPOSTED')||ofxTag(b,'DTUSER')),rawAmt=Number(ofxTag(b,'TRNAMT')),name=ofxTag(b,'NAME'),memo=ofxTag(b,'MEMO'),typeTag=ofxTag(b,'TRNTYPE'),description=[name,memo].filter(Boolean).join(' — ').replace(/\s+/g,' ').trim();if(!date||!description||!Number.isFinite(rawAmt)||rawAmt===0)continue;let kind;if(ui.bank.accountType==='credit')kind='expense';else kind=rawAmt>0?'income':'expense';const amount=Math.abs(rawAmt),type=kind==='income'?'':guessExpenseType(description),category=kind==='income'?'':guessCategory(description,type);out.push({include:true,date,description,amount,kind,category,type,confidence:.99,source})}return out.length?out:parseBankText(text,source)}
function analysePastedBankText(text){text=String(text||'').trim();if(!text)return toast('Colle d’abord des transactions','error');const parsed=parseBankText(text,'Copier-coller bancaire');ui.bank.rawText=text;ui.bank.candidates=dedupeImportCandidates(parsed).map(x=>({...x,duplicate:isImportDuplicate(x)}));ui.bank.status='done';ui.bank.message=`${ui.bank.candidates.length} transaction${ui.bank.candidates.length>1?'s':''} détectée${ui.bank.candidates.length>1?'s':''}`;ui.bank.progress=100;render();if(!ui.bank.candidates.length)toast('Aucune ligne reconnue. Vérifie que chaque transaction contient une date et un montant.','warn');else toast(`${ui.bank.candidates.length} transaction${ui.bank.candidates.length>1?'s':''} préparée${ui.bank.candidates.length>1?'s':''}`)}

function parseBankText(text,source){
  const rawLines=String(text||'').replace(/\u00a0/g,' ').replace(/\u2212/g,'-').split(/\r?\n/);

  // Conserver les lignes vides : les sites bancaires les utilisent souvent
  // pour séparer les opérations d'une même journée.
  const blocks=[];
  let current=[];
  const flush=()=>{
    const b=current.map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
    if(b.length)blocks.push(b);
    current=[]
  };
  for(const raw of rawLines){
    if(!String(raw).trim())flush();
    else current.push(raw)
  }
  flush();

  const out=[];
  let activeDate=null;

  for(const block of blocks){
    let parts=[...block];

    // Une date seule (ex. "Aug 27, 2026") devient la date active
    // pour toutes les opérations suivantes jusqu'à la prochaine date.
    const firstDate=extractDateFromLine(parts[0]||'');
    if(firstDate){
      activeDate=firstDate;

      // Si le bloc contient seulement la date, il n'y a pas encore d'opération.
      if(parts.length===1&&!extractMoneyValues(parts[0]).length)continue;

      // Si date + opération sont dans le même bloc, garder tout le bloc.
    }

    const dateObj=firstDate||activeDate;
    if(!dateObj)continue;

    // Un bloc peut exceptionnellement contenir plusieurs opérations.
    // On le découpe dès qu'un montant finalise une opération.
    const groups=[];
    let g=[];
    for(const p of parts){
      const d=extractDateFromLine(p);
      if(d&&g.length){
        groups.push(g);
        g=[];
        activeDate=d;
      }
      g.push(p);

      // Si la ligne contient un montant, considérer que l'opération est complète.
      if(extractMoneyValues(p).length){
        groups.push(g);
        g=[];
      }
    }
    if(g.length)groups.push(g);

    for(const group of groups){
      const joined=group.join(' ').replace(/\s+/g,' ').trim();
      if(!joined)continue;

      const groupDate=extractDateFromLine(group[0]||'')||activeDate||dateObj;
      if(!groupDate)continue;

      const amounts=extractMoneyValues(joined);
      if(!amounts.length)continue;

      const picked=pickTransactionAmount(amounts,joined);
      if(!picked||!(picked.amount>0))continue;

      const date=normalizeBankDate(groupDate,ui.bank.statementMonth||state.selectedMonth);
      if(!date)continue;

      let desc=cleanBankDescription(joined,groupDate.raw,picked.raw);
      if(desc.length<2||isHeaderOrTotal(desc))continue;

      const kind=guessKind(joined,picked.signed),
            type=kind==='income'?'':guessExpenseType(joined),
            category=kind==='income'?'':guessCategory(joined,type);

      let confidence=.86;
      if(groupDate.ambiguous)confidence-=.12;
      if(amounts.length>2)confidence-=.1;
      if(desc.length<4)confidence-=.15;
      if(/balance|solde/i.test(joined))confidence-=.08;

      out.push({
        include:true,
        date,
        description:desc,
        amount:picked.amount,
        kind,
        category,
        type,
        confidence:Math.max(.35,Math.min(.96,confidence)),
        source
      })
    }
  }
  return out
}
function extractDateFromLine(line){
  let m=line.match(/\b(20\d{2})[-\/.](0?[1-9]|1[0-2])[-\/.]([0-3]?\d)\b/);if(m)return{raw:m[0],y:+m[1],m:+m[2],d:+m[3],ambiguous:false};
  m=line.match(/\b(0?[1-9]|1[0-2])[\/-]([0-3]?\d)(?:[\/-](\d{2,4}))?\b/);if(m)return{raw:m[0],m:+m[1],d:+m[2],y:m[3]?normalizeYear(+m[3]):null,ambiguous:(+m[1]<=12&&+m[2]<=12)};
  m=line.match(/\b([0-3]?\d)[\/-](0?[1-9]|1[0-2])(?:[\/-](\d{2,4}))?\b/);if(m&&+m[1]>12)return{raw:m[0],d:+m[1],m:+m[2],y:m[3]?normalizeYear(+m[3]):null,ambiguous:false};
  const months={jan:1,january:1,janv:1,janvier:1,feb:2,february:2,fev:2,févr:2,fevrier:2,février:2,mar:3,march:3,mars:3,apr:4,april:4,avr:4,avril:4,may:5,mai:5,jun:6,june:6,juin:6,jul:7,july:7,juil:7,juillet:7,aug:8,august:8,aout:8,août:8,sep:9,sept:9,september:9,septembre:9,oct:10,october:10,octobre:10,nov:11,november:11,novembre:11,dec:12,december:12,decembre:12,décembre:12};
  m=line.match(/\b([A-Za-zÀ-ÿ]{3,10})\.?\s+([0-3]?\d)(?:,?\s+(20\d{2}))?\b/i);if(m&&months[m[1].toLowerCase().replace('.','')])return{raw:m[0],m:months[m[1].toLowerCase().replace('.','')],d:+m[2],y:m[3]?+m[3]:null,ambiguous:false};
  m=line.match(/\b([0-3]?\d)\s+([A-Za-zÀ-ÿ]{3,10})\.?(?:\s+(20\d{2}))?\b/i);if(m&&months[m[2].toLowerCase().replace('.','')])return{raw:m[0],d:+m[1],m:months[m[2].toLowerCase().replace('.','')],y:m[3]?+m[3]:null,ambiguous:false};return null
}
function normalizeYear(y){return y<100?2000+y:y}
function normalizeBankDate(d,statementMonth){const [sy,sm]=String(statementMonth||state.selectedMonth).split('-').map(Number);let y=d.y||sy,m=d.m,day=d.d;if(d.ambiguous&&sm===d.d&&sm!==d.m){m=d.d;day=d.m}if(!y||!m||!day)return'';const dt=new Date(y,m-1,day);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==day)return'';return`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function extractMoneyValues(line){const re=/(?:^|\s)([-+]?\s*(?:\$|CAD\s*)?\(?\d{1,3}(?:[ ,]\d{3})*(?:[.,]\d{2})\)?(?:\s*(?:CR|DR))?)(?=\s|$)/gi;let m,out=[];while((m=re.exec(' '+line+' '))){const raw=m[1].trim();let s=raw.replace(/CAD|\$|\s/gi,'');const cr=/CR$/i.test(s),dr=/DR$/i.test(s);s=s.replace(/(?:CR|DR)$/i,'');const par=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');let v=parseFloat(s);if(!Number.isFinite(v))continue;if(par)v=-Math.abs(v);if(cr)v=-Math.abs(v);if(dr)v=Math.abs(v);out.push({raw,value:v})}return out}
function pickTransactionAmount(vals,line){if(!vals.length)return null;let idx=vals.length===1?0:vals.length-2;if(/credit card|visa|mastercard|amex/i.test(line)&&vals.length<=2)idx=vals.length-1;const v=vals[idx];return{raw:v.raw,amount:Math.abs(v.value),signed:v.value}}
function cleanBankDescription(line,dateRaw,amountRaw){let s=line.replace(dateRaw,' ');for(const mv of extractMoneyValues(s))s=s.replace(mv.raw,' ');s=s.replace(/\b(?:balance|solde)\b.*$/i,' ').replace(/\s+/g,' ').trim();s=s.replace(/^[-–—:]+|[-–—:]+$/g,'').trim();return s.slice(0,120)}
function isHeaderOrTotal(s){return /^(date|description|transactions?|withdrawals?|deposits?|debits?|credits?|balance|solde|total|opening balance|closing balance)$/i.test(s.trim())}
function guessKind(line,signed){const s=line.toLowerCase();if(ui.bank.accountType==='credit')return'expense';if(/payroll|salary|deposit|direct dep|credit memo|interest paid|e-?transfer from|etransfer from|refund received|government|canada fed|benefit|ccb|acfb/.test(s))return'income';if(signed<0&&/credit|deposit|refund/.test(s))return'income';return'expense'}
function guessExpenseType(line){const s=line.toLowerCase();if(/payment received|payment thank|paiement|credit balance|refund|reversal|return/.test(s))return'Remboursement';if(/transfer to|transfert vers|savings|épargne/.test(s))return'Transfert';if(/rent|loyer|insurance|assurance|freedom mobile|rogers|telus|bell|netflix|spotify|disney|prime|loan|mortgage/.test(s))return'Fixe';return'Dépense'}
function guessCategory(line,type='Dépense'){
  const s=(' '+line+' ').toLowerCase();if(type==='Remboursement')return'Remboursement VISA';if(type==='Transfert')return'Épargne - Transfert';
  const rules=[['Épicerie',/walmart|wal-mart|superstore|no frills|nofrills|safeway|save.on|costco|freshco|sobeys|co-op|coop|bulk barn|grocery|market/],['Restaurant',/tim horton|starbucks|mcdonald|restaurant|doordash|skip ?the ?dishes|uber ?eats|wendy|subway|pizza|a&w/],['Essence',/shell|esso|petro|husky|centex|gas bar|fuel|gasoline/],['Téléphones',/freedom mobile|rogers|telus|bell mobility|fido|koodo/],['Abonnement',/netflix|spotify|disney|amazon prime|prime video|crave|youtube premium|icloud|google one/],['Loyer',/rent|loyer|landlord/],['Assurance auto',/primmum|auto insurance|car insurance|assurance auto|intact.*auto|ama insurance/],['Assurance habitation',/home insurance|tenant insurance|assurance habitation/],['Soccer Silas',/soccer|cmsa|foothills|villains fc|blizzard|west hills|southwest united/],['Loisir / Sport',/sport|recreation|cineplex|movie|cinema|ymca|gym/],['Vêtements',/winners|marshalls|old navy|h&m|zara|clothing|foot locker|sport chek/],['Auto',/canadian tire.*auto|mechanic|tire|oil change|kal tire|midas|jiffy lube/],['Maison',/dollarama|home depot|ikea|homesense|canadian tire|winners|amazon|temu/],['Frais bancaires',/service charge|bank fee|monthly fee|overdraft|nsf/]];for(const [cat,re] of rules)if(re.test(s)&&state.categories.includes(cat))return cat;return state.categories.includes('Maison')?'Maison':state.categories[0]||'Maison'}
function dedupeImportCandidates(arr){const seen=new Set();return arr.filter(x=>{const k=`${x.date}|${normDesc(x.description)}|${Number(x.amount).toFixed(2)}`;if(seen.has(k))return false;seen.add(k);return true})}
function normDesc(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function isImportDuplicate(x){if(x.kind==='income')return state.revenus.some(r=>String(r.ProchaineDate).slice(0,10)===x.date&&Math.abs(Number(r.Montant)-Number(x.amount))<.005&&normDesc(r.Source).includes(normDesc(x.description).split(' ').slice(0,2).join(' ')));return state.depenses.some(d=>String(d.Date).slice(0,10)===x.date&&Math.abs(Number(d.Montant)-Number(x.amount))<.005&&(normDesc(d.Description)===normDesc(x.description)||normDesc(d.Description).includes(normDesc(x.description).split(' ').slice(0,2).join(' '))||normDesc(x.description).includes(normDesc(d.Description).split(' ').slice(0,2).join(' '))))}
function refreshBankResults(){if(state.activeTab==='bankimport')render()}
function importBankCandidates(){
  const chosen=(ui.bank.candidates||[]).filter(x=>x.include!==false&&x.date&&Number(x.amount)>0);if(!chosen.length)return toast('Aucune transaction sélectionnée','error');let expenses=0,incomes=0,skipped=0;
  for(const x of chosen){if(isImportDuplicate(x)&&x.duplicate){skipped++;continue}if(x.kind==='income'){state.revenus.push({id:uid('rev'),Source:x.description,Montant:Number(x.amount),Frequence:'Import bancaire',Jour:String(Number(x.date.slice(8,10))),ProchaineDate:x.date,Statut:'Reçu',Cycle:cycleForDate(x.date),Note:`Importé depuis ${x.source||'relevé bancaire'}`});incomes++}else{state.depenses.push({id:uid('dep'),Date:x.date,Description:x.description,Montant:Number(x.amount),Categorie:x.category||guessCategory(x.description,x.type),Compte:ui.bank.accountName||'Compte bancaire',Type:x.type||'Dépense',Cycle:cycleForDate(x.date),Mois:monthOfDate(x.date)});expenses++}}
  const months=[...new Set(chosen.map(x=>monthOfDate(x.date)).filter(Boolean))];if(months.length===1)state.selectedMonth=months[0];state.activeTab='depenses';ui.bank.candidates=[];ui.bank.rawText='';commit(`${expenses+incomes} transaction${expenses+incomes>1?'s':''} ajoutée${expenses+incomes>1?'s':''}${skipped?` • ${skipped} doublon${skipped>1?'s':''} ignoré${skipped>1?'s':''}`:''}`)
}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`budget-sihem-walid-${state.selectedMonth}.json`;a.click();URL.revokeObjectURL(url);toast('Sauvegarde JSON exportée')}
function exportCSV(){const rows=[['Date','Description','Montant','Catégorie','Compte','Type','Cycle'],...selectedExpenses().map(x=>[x.Date,x.Description,x.Montant,x.Categorie,x.Compte,x.Type,x.Cycle])];const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`depenses-${state.selectedMonth}.csv`;a.click();URL.revokeObjectURL(url);toast('CSV exporté')}
document.querySelector('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.depenses||!s.revenus)throw new Error('format');state={...baseState(),...s};ui.modal=null;ui.editId=null;commit('Import réussi')}catch(err){toast('Fichier JSON non reconnu','error')}e.target.value=''};r.readAsText(f)});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveState(true)}if(!ui.modal&&e.key.toLowerCase()==='n'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){openModal('expense')}});
