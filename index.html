async function cloudCheckRemote({initial=false,manual=false}={}){
  if(!cloud.user||!cloud.docRef||!cloud.authorized)return;
  // Ne jamais interrompre un menu, un champ ou une fenêtre que l'utilisateur manipule.
  if(!initial&&!manual&&userIsInteracting())return;

  try{
    const snap=await cloud.docRef.get();

    if(!snap.exists){
      if(initial&&HAD_LOCAL_STATE&&hasMeaningfulLocalState()){
        await cloudPushNow(true)
      }
      cloud.status='online';
      updateCloudUI();
      return
    }

    const data=snap.data()||{},remote=data.state||{},rh=sharedHash(remote),remoteAt=data.updatedAtClient||'';

    if(initial){
      cloud.initialResolved=true;
      const localAt=(()=>{try{return localStorage.getItem(CLOUD_SHARED_CHANGED_KEY)||''}catch(e){return''}})();

      if(!HAD_LOCAL_STATE||!localAt||(remoteAt&&remoteAt>=localAt)){
        cloud.applyingRemote=true;
        cloud.lastHash=rh;
        persistRemoteLocally(remote,remoteAt);
        cloud.applyingRemote=false;
        // Les migrations locales (ex. V4.15) doivent rejoindre le budget partagé
        // une seule fois. Le polling par minute évite la boucle des anciennes versions.
        const correctedHash=sharedHash(sharedStateSnapshot());
        if(correctedHash&&correctedHash!==rh){
          cloud.lastHash=correctedHash;
          await cloudPushNow(true)
        }
      }else{
        await cloudPushNow(true)
      }
      cloud.status='online';
      updateCloudUI();
      return
    }

    // S'il existe une vraie modification locale pas encore envoyée, ne jamais l'écraser.
    const localHash=sharedHash(sharedStateSnapshot());
    if(cloud.lastHash&&localHash!==cloud.lastHash){
      return
    }

    if(rh&&rh!==cloud.lastHash){
      cloud.applyingRemote=true;
      cloud.lastHash=rh;
      persistRemoteLocally(remote,remoteAt);
      cloud.applyingRemote=false;
      cloud.status='online';
      updateCloudUI();
      // Pas de toast répétitif : le changement est appliqué silencieusement.
    }else{
      cloud.status='online';
      updateCloudUI()
    }
  }catch(e){
    cloud.status='error';
    cloud.error=e.message||String(e);
    updateCloudUI()
  }
}

function connectCloudDocument(){
  if(!cloud.user||!cloud.db)return;

  cloud.status='connecting';
  cloud.error='';
  cloud.authorized=true;
  updateCloudUI();

  if(cloud.unsubscribe)cloud.unsubscribe();

  cloud.docRef=cloud.db.collection('households')
    .doc(String(cloud.settings.householdId))
    .collection('app')
    .doc('budget');

  // Fonction de nettoyage compatible avec l'ancien mécanisme unsubscribe.
  cloud.unsubscribe=()=>{
    if(cloud.pollTimer)clearInterval(cloud.pollTimer);
    cloud.pollTimer=null
  };

  // Un seul chargement au démarrage.
  cloudCheckRemote({initial:true}).then(()=>{
    // Puis une vérification distante toutes les 30 secondes.
    if(cloud.pollTimer)clearInterval(cloud.pollTimer);
    cloud.pollTimer=setInterval(()=>cloudCheckRemote(),30000)
  })
}

function applyKnownCorrections(s){
  if(!s||typeof s!=='object')return s;
  s.depenses=Array.isArray(s.depenses)?s.depenses:[];
  s.echeancier=Array.isArray(s.echeancier)?s.echeancier:[];
  s._corrections=(s._corrections&&typeof s._corrections==='object')?s._corrections:{};

  // ---------------- V3 : assurances séparées + montant variable ----------------
  if(!s._corrections.echeancierRealityV3){
    // Les prélèvements Primmum identifiés dans les données sont des assurances auto.
    for(const x of s.depenses){
      if(normDesc(x.Description).includes('primmum insurance')){
        x.Categorie='Assurance auto';
        if(!x.Type||x.Type==='Dépense')x.Type='Fixe';
      }
    }

    // Électricité : rappel conservé, sans faux montant prévu.
    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n==='electricite'||n.includes('enmax')||n.includes('carma')){
        d.Montant=null;
        d.MontantVariable=true;
        d.MatchMerchant='carma webrecurr';
        d.Categorie=d.Categorie||'Maison';
      }
    }

    const hasTucson=s.echeancier.some(d=>normDesc(d.Nom).includes('assurance tucson'));
    const hasTown=s.echeancier.some(d=>/assurance town( and| &)? country/.test(normDesc(d.Nom))||normDesc(d.Nom).includes('assurance town country'));
    const oldIdx=s.echeancier.findIndex(d=>{
      const n=normDesc(d.Nom);
      return n==='assurance auto'&&!n.includes('tucson')&&!n.includes('town');
    });

    const primmum=s.depenses
      .filter(x=>normDesc(x.Description).includes('primmum insurance')&&Number(x.Montant)>0)
      .map(x=>({amount:Number(x.Montant),date:String(x.Date||''),day:Number(String(x.Date||'').slice(8,10))||0}))
      .sort((a,b)=>b.amount-a.amount);

    const distinct=[];
    for(const p of primmum){
      if(!distinct.some(q=>Math.abs(q.amount-p.amount)<=0.02))distinct.push(p);
    }
    const high=distinct[0]||null,low=distinct[1]||null;

    if(oldIdx>=0&&(!hasTucson||!hasTown)){
      const old=s.echeancier[oldIdx];
      const base={...old,Paiements:{},Categorie:'Assurance auto',Frequence:old.Frequence||'Mensuel',Alerte:''};
      const items=[];
      if(!hasTucson)items.push({
        ...base,
        id:`${old.id||'ech-assurance-auto'}-tucson`,
        Nom:'Assurance Tucson',
        Montant:high?high.amount:null,
        MontantVariable:!high,
        Jour:high?.day||Number(old.Jour)||7,
        MatchRole:'primmum-high',
        MatchMerchant:'primmum insurance'
      });
      if(!hasTown)items.push({
        ...base,
        id:`${old.id||'ech-assurance-auto'}-town-country`,
        Nom:'Assurance Town & Country',
        Montant:low?low.amount:null,
        MontantVariable:!low,
        Jour:low?.day||(high?.day?Math.min(28,high.day+10):17),
        MatchRole:'primmum-low',
        MatchMerchant:'primmum insurance'
      });
      s.echeancier.splice(oldIdx,1,...items);
    }

    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n.includes('assurance tucson')){
        d.MatchRole='primmum-high';d.MatchMerchant='primmum insurance';d.Categorie='Assurance auto';
        if((d.Montant===null||d.Montant===''||d.Montant===undefined)&&high){d.Montant=high.amount;d.MontantVariable=false}
      }
      if(n.includes('assurance town')&&n.includes('country')){
        d.MatchRole='primmum-low';d.MatchMerchant='primmum insurance';d.Categorie='Assurance auto';
        if((d.Montant===null||d.Montant===''||d.Montant===undefined)&&low){d.Montant=low.amount;d.MontantVariable=false}
      }
    }
    s._corrections.echeancierRealityV3=true;
  }

  // ---------------- V4 : corrections basées sur les libellés bancaires réels ----------------
  if(!s._corrections.echeancierRealityV4){

    // A) Loyer : le vrai libellé bancaire est DPA Mainstreet Equi.
    for(const d of s.echeancier){
      const n=normDesc(d.Nom);
      if(n==='loyer'||n.startsWith('loyer ')){

    // E) Assurances : Tucson = Primmum la plus élevée, Town & Country = la seconde.

  // ---------------- V4.15 : audit complet des montants / imports ----------------
  if(!s._corrections.auditFixV415){

    });
    for(const x of convertToIncome){

    const v414TransferIncome=s.revenus.filter(r=>

function latestSalaryCycleStart(referenceDate){

    .sort();

  if(!salaryDates.length){
    // Repli sur les cycles historiques existants si aucun salaire n'est encore identifiable.
    const day=Number(referenceDate.slice(8,10));
    if(day>=15&&day<=29)return `${referenceDate.slice(0,7)}-15`;
    if(day>=30)return `${referenceDate.slice(0,7)}-30`;

        && String(x.Type||'')==='Transfert'

  }

    let [y,m]=cur.split('-').map(Number);

    cur=`${y}-${String(m).padStart(2,'0')}`

    const rec=reconcileDueMonth(month);
    for(const due of state.echeancier||[]){
      if(!dueAppliesToMonth(due,month)||!dueHasPlannedAmount(due))continue;

        c.score>=5&&c.diff!==null

    }
  }

}

function addEnvelopeContribution(env,amount,sourceAccount){

  if(amount>current+.01)return toast(`Le montant dépasse le disponible de ${sourceAccount}`,'error'),false;

function transferEnvelopeFunds(env,amount,destination){
  amount=Number(amount||0);
  if(!(amount>0)||!env)return false;
  const saved=Number(env.Deja||0);
  if(amount>saved+.01)return toast(`Il n’y a que ${money(saved)} dans cette enveloppe`,'error'),false;

  const now=new Date().toISOString(),today=isoLocalToday();
  env.Deja=Math.max(0,saved-amount);
  env.Reste=Math.max(0,Number(env.Objectif||0)-env.Deja);
  env.Contributions=Array.isArray(env.Contributions)?env.Contributions:[];
  env.Contributions.push({
    id:uid('envc'),Date:today,Montant:-amount,CreatedAt:now,
    Destination:destination,Kind:'withdrawal',
    Note:`Transfert depuis ${env.Enveloppe}`
  });
  env.UpdatedAt=now;

  if(destination==='Débit Sihem'||destination==='Débit Walid'){
    // Enveloppe -> compte courant : l'avoir total reste identique.
    setCalculatedAccountBalance(destination,currentAccountBalance(destination)+amount,now,today);
    return {kind:'debit',destination}
  }

  if(destination==='Visa Infinite'){
    // Enveloppe -> VISA : c'est un vrai paiement de dette.
    // L'avoir baisse du montant sorti de l'enveloppe et la VISA due baisse aussi.

  }

  env.Contributions.pop();

function calc(){
  const ex=selectedExpenses();
  let fixed=ex.filter(x=>x.Type==="Fixe").reduce((sum,x)=>sum+Number(x.Montant||0),0);
  let variable=ex.filter(x=>x.Type==="Dépense").reduce((sum,x)=>sum+Number(x.Montant||0),0);
  const transfers=ex.filter(x=>x.Type==="Transfert").reduce((sum,x)=>sum+Number(x.Montant||0),0);
  const internalTransfers=ex.filter(x=>x.Type==="Transfert interne").reduce((sum,x)=>sum+Number(x.Montant||0),0);
  const refunds=ex.filter(x=>x.Type==="Remboursement").reduce((sum,x)=>sum+Number(x.Montant||0),0);

  // Solde Visa restant à rembourser :
  // toutes les dépenses réellement sorties de la Visa, moins les remboursements Visa.
  // Ne jamais afficher un montant négatif.
  const visaCharges=ex.filter(x=>{
    const account=normDesc(x.Compte);
    return (account.includes('visa infinite')||account.includes('visa'))
      && x.Type!=="Remboursement"
      && x.Type!=="Transfert"
      && x.Type!=="Transfert interne";
  }).reduce((sum,x)=>sum+Number(x.Montant||0),0);
  const visaStatement=visaStatementRemaining();
  const visaOutstanding=visaStatement.remaining;

  const reconciliation=reconcileDueMonth(state.selectedMonth);
  const cycleCash=liveCashMetrics();
  const liquidAssets=totalCashAndEnvelopes();
  const resp=respMetrics();

  let manualScheduledFixed=0,manualScheduledVariable=0,manualScheduledTransfers=0;
  let outstandingFixed=0,outstandingVariable=0,outstandingTransfers=0;

  for(const due of state.echeancier){
    if(!dueAppliesToMonth(due,state.selectedMonth))continue;
    const r=reconciliation.get(due.id);
    const dueType=String(due.Type||'Fixe');

    // Un remboursement de carte n'est pas une nouvelle dépense du ménage :
    // les achats Visa sont déjà comptés au moment de l'achat.
    if(dueType==='Remboursement'||dueType==='Transfert interne')continue;

    // Si l'utilisateur a coché "payé" mais qu'une transaction très probable existe déjà,
    // ne pas rajouter une deuxième fois le montant planifié.
    let likelyExpenseAlreadyCounted=false;
    if(r?.manualPaid&&!r.matchedExpenseIds?.length&&dueHasPlannedAmount(due)){
      const candidates=dueReviewCandidates(due,state.selectedMonth);
      likelyExpenseAlreadyCounted=!!candidates.find(c=>
        c.score>=5
        && c.diff!==null
        && c.diff<=Math.max(1.5,duePlannedAmount(due)*.03)
      );
    }

    if(r?.manualPaid&&!r.matchedExpenseIds?.length&&!likelyExpenseAlreadyCounted){
      const amount=duePlannedAmount(due);
      if(dueType==='Dépense')manualScheduledVariable+=amount;
      else if(dueType==='Transfert')manualScheduledTransfers+=amount;
      else manualScheduledFixed+=amount;
      continue;
    }

    // Une échéance pas encore payée doit faire partie du vrai "solde planifié"
    // de fin de mois, mais seulement si elle possède un montant prévu.
    if(!r?.paid&&dueHasPlannedAmount(due)){
      const amount=duePlannedAmount(due);
      if(dueType==='Dépense')outstandingVariable+=amount;
      else if(dueType==='Transfert')outstandingTransfers+=amount;
      else outstandingFixed+=amount;
    }
  }

  fixed+=manualScheduledFixed;
  variable+=manualScheduledVariable;
  const spend=fixed+variable;
  const projectedFixed=fixed+outstandingFixed;
  const projectedVariable=variable+outstandingVariable;
  const projectedTransfers=transfers+manualScheduledTransfers+outstandingTransfers;
  const projectedSpend=projectedFixed+projectedVariable;
  const remaining=incomePlan()-projectedFixed-projectedVariable-projectedTransfers;

  const enteredIncome=selectedIncomeEntries().reduce((sum,x)=>sum+Number(x.Montant||0),0);
  const byCat={};
  for(const x of ex)byCat[x.Categorie]=(byCat[x.Categorie]||0)+Number(x.Montant||0);

  // Les cycles restent des mouvements de trésorerie : on les affiche comme tels.
  const c1=ex.filter(x=>String(x.Cycle).includes("01-14")).reduce((sum,x)=>sum+Number(x.Montant||0),0);
  const c2=ex.filter(x=>String(x.Cycle).includes("15-29")).reduce((sum,x)=>sum+Number(x.Montant||0),0);

  return {
    ex,fixed,variable,transfers,internalTransfers,refunds,spend,remaining,enteredIncome,byCat,c1,c2,
    manualScheduledFixed,manualScheduledVariable,manualScheduledTransfers,
    outstandingFixed,outstandingVariable,outstandingTransfers,
    projectedFixed,projectedVariable,projectedTransfers,projectedSpend,
    visaCharges,visaOutstanding,visaStatement,
    cycleCash,liquidAssets,resp,
    reconciliation
  };
}

function dueMatchProfile(text){

  const groups=[
    [/\b(pret etudiant|student loans?|nslsc|national student loans?)\b/,' studentloan '],
    [/\b(loyer|rent|landlord|mainstreet equi|mainstreet)\b/,' rent '],
    [/\b(assurance habitation|tenant insurance|home insurance)\b/,' homeinsurance '],
    [/\b(assurance auto|assurance tucson|assurance town( and| &)? country|auto insurance|car insurance|primmum insurance)\b/,' autoinsurance '],

    [/\b(telephone|telephones|freedom mobile|mobile|cell|rogers|telus|fido|koodo|bell)\b/,' phone '],

function reconcileDueMonth(month=state.selectedMonth){

  const dues=state.echeancier.filter(d=>dueAppliesToMonth(d,month)).sort((a,b)=>dueDateForMonth(a,month).localeCompare(dueDateForMonth(b,month)));

  // Liens explicites créés par l'échéancier ou choisis manuellement.
  for(const due of dues){
    const explicit=expenses.filter(x=>!used.has(x.id)&&x.EcheanceId===due.id&&String(x.EcheanceMois||monthOfDate(x.Date))===month);
    if(explicit.length){explicit.forEach(x=>used.add(x.id));result.set(due.id,matchResult(explicit,'auto',100))}
  }

  // Assurances auto Primmum : si les deux prélèvements sont présents,
  // la plus élevée est Tucson et la plus faible Town & Country.
  const primmumExpenses=expenses.filter(x=>!used.has(x.id)&&normDesc(x.Description).includes('primmum insurance')&&Number(x.Montant)>0).sort((a,b)=>Number(b.Montant)-Number(a.Montant));

  const town=dues.find(d=>d.MatchRole==='primmum-low'&&!result.has(d.id));

    const hi=primmumExpenses[0],lo=primmumExpenses[primmumExpenses.length-1];
    used.add(hi.id);result.set(tucson.id,matchResult([hi],'auto',100));
    if(lo.id!==hi.id){used.add(lo.id);result.set(town.id,matchResult([lo],'auto',100))}
  }

  for(const due of dues){

    const entry=dueMonthEntry(due,month),hasAmount=dueHasPlannedAmount(due),amount=duePlannedAmount(due),dueCat=dueCategoryForMatch(due),merchant=normDesc(due.MatchMerchant||'');

      const actual=Math.abs(Number(exp.Montant||0)),diff=hasAmount?Math.abs(actual-amount):null,nameScore=dueNameScore(due.Nom,exp.Description),sameCat=!!dueCat&&String(exp.Categorie||'')===String(dueCat),merchantMatch=merchant&&normDesc(exp.Description).includes(merchant),score=dueCandidateScore(due,exp,month);

        accept=exactAccept||nearAccept;
      }

      if(!accept)continue;

    }

    if(hasAmount){
      const pool=expenses.filter(exp=>!used.has(exp.id)&&(!exp.EcheanceId||exp.EcheanceId===due.id)).map(exp=>({
        exp,score:dueCandidateScore(due,exp,month),name:dueNameScore(due.Nom,exp.Description),
        sameCat:!!dueCat&&String(exp.Categorie||'')===String(dueCat)

      let combo=null,comboScore=-1;

        const pair=[pool[i],pool[j]],sum=pair.reduce((z,x)=>z+Math.abs(Number(x.exp.Montant||0)),0);
        if(Math.abs(sum-amount)<=.02){const sc=pair.reduce((z,x)=>z+x.score,0);if(sc>comboScore){combo=pair;comboScore=sc}}
        for(let k=j+1;k<pool.length;k++){

          if(Math.abs(sum3-amount)<=.02){const sc=trio.reduce((z,x)=>z+x.score,0);if(sc>comboScore){combo=trio;comboScore=sc}}
        }
      }
      if(combo){const matched=combo.map(x=>x.exp);matched.forEach(x=>used.add(x.id));result.set(due.id,matchResult(matched,'auto',comboScore));continue}
    }

    result.set(due.id,{paid:!!entry.manualPaid,manualPaid:!!entry.manualPaid,matchedExpenseId:null,matchedExpenseIds:[],actualPaid:entry.manualPaid?duePlannedAmount(due):0,source:entry.manualPaid?'manual':'',score:0});
  }
  return result
}

function renderAuthGate(){

  let body='';
  if(!cloud.authChecked||cloud.status==='connecting'){

  }else if(!user&&cloud.status==='error'){

  }else if(!user){
    body=`<p>Connectez-vous avec votre compte Google autorisé pour accéder au budget familial.</p><button class="auth-google" id="secureGoogleLogin"><span style="font-size:18px">G</span> Continuer avec Google</button><div class="auth-status">Les données financières ne sont pas intégrées dans cette page. Elles sont chargées uniquement après authentification et autorisation Firestore.</div>`;
  }else if(cloud.status==='denied'||cloud.status==='error'){
    const msg=cloud.status==='denied'?'Votre compte Google est authentifié, mais son UID doit encore être ajouté aux règles Firestore.':`Impossible de vérifier l’accès : ${esc(cloud.error||'erreur inconnue')}`;
    const diag=`Projet Firebase : ${esc(cloud.settings.projectId||'—')} • clé …${esc(String(cloud.settings.apiKey||'').slice(-4))}`;
    body=`<p>${msg}</p><div class="auth-status"><strong>Compte connecté</strong><br>${esc(user.email||user.displayName||'Compte Google')}<div class="auth-uid"><strong>UID Firebase :</strong> <span id="secureUid">${esc(user.uid||'')}</span></div><div class="tiny" style="margin-top:8px">${diag}</div></div><div class="auth-actions"><button class="btn primary" id="copySecureUid">Copier l’UID</button><button class="btn" id="secureLogout">Changer de compte</button></div>`;
  }else{
    body=`<div class="auth-spinner"></div><p>Connexion à votre budget partagé…</p>`;
  }
  app.innerHTML=`<div class="auth-gate"><div class="auth-card"><div class="auth-logo">B</div><h1>FamilyBudget</h1>${body}<div class="tiny" style="margin-top:18px">Accès protégé par Google Authentication + règles Firestore.</div></div></div>`;
  const login=document.querySelector('#secureGoogleLogin');if(login)login.onclick=()=>cloudLogin();
  const logout=document.querySelector('#secureLogout');if(logout)logout.onclick=()=>cloudLogout();
  const copy=document.querySelector('#copySecureUid');if(copy)copy.onclick=async()=>{try{await navigator.clipboard.writeText(cloud.user?.uid||'');copy.textContent='UID copié ✓'}catch(e){const u=document.querySelector('#secureUid');if(u){const r=document.createRange();r.selectNodeContents(u);const s=getSelection();s.removeAllRanges();s.addRange(r)}}};
}

function tabsHtml(){return [{id:"dashboard",l:"Tableau de bord"},{id:"depenses",l:"Dépenses"},{id:"revenus",l:"Revenus"},{id:"enveloppes",l:"Enveloppes"},{id:"echeancier",l:"Échéancier"},{id:"analyse",l:"Analyse"},{id:"bankimport",l:"Import bancaire"},{id:"reglages",l:"Réglages"}].map(x=>`<button class="tab ${state.activeTab===x.id?'active':''}" data-tab="${x.id}">${x.l}</button>`).join("")}
function renderTab(c,dups){switch(state.activeTab){case"depenses":return expensesView(c,dups);case"revenus":return incomesView();case"enveloppes":return envelopesView();case"echeancier":return scheduleView();case"analyse":return analysisView(c);case"bankimport":return bankImportView();case"reglages":return settingsView(c);default:return dashboardView(c,dups)}}
function respNeedsUpdate(){const d=String(state.respAccount?.asOfDate||'');if(!d)return true;return daysBetweenIso(d,isoLocalToday())>35}
function reviewItems(){
  const expenses=(state.depenses||[])
    .filter(x=>!x.ReviewedAt&&(x.NeedsReview||x.Categorie==='Divers / À classer'||Number(x.ImportConfidence||1)<.65))
    .map(x=>({type:'expense',id:x.id,title:x.Description,amount:x.Montant,reason:x.ReviewReason||'Transaction à confirmer'}));

  const incomes=(state.revenus||[])
    .filter(x=>!x.ReviewedAt&&(x.NeedsReview||Number(x.ImportConfidence||1)<.65))
    .map(x=>({type:'income',id:x.id,title:x.Source,amount:x.Montant,reason:x.ReviewReason||'Revenu à confirmer'}));

  const dues=[];
  const rec=reconcileDueMonth(state.selectedMonth);
  for(const due of state.echeancier||[]){
    if(!dueAppliesToMonth(due,state.selectedMonth))continue;
    const r=rec.get(due.id),entry=dueMonthEntry(due,state.selectedMonth);
    if(r?.manualPaid&&!r.matchedExpenseIds?.length&&!entry.reviewConfirmedAt){
      dues.push({
        type:'due',id:due.id,title:due.Nom,
        amount:dueHasPlannedAmount(due)?duePlannedAmount(due):0,
        reason:'Coché payé manuellement sans transaction bancaire associée'
      })
    }
  }

  const alerts=[];
  for(const [name,v] of Object.entries(state.accountBalances||{})){
    if(v?.approximate||!v?.verifiedAt){
      alerts.push({type:'balance',id:name,title:`Solde ${name}`,reason:v?.approximate?'Montant approximatif':'Solde non vérifié'})
    }
  }
  if(respNeedsUpdate())alerts.push({type:'resp',id:'resp',title:'RESP des garçons',reason:'Solde à mettre à jour'});
  return [...expenses,...incomes,...dues,...alerts]
}

function filteredExpenses(c,dups){let a=[...c.ex];const q=ui.search.trim().toLowerCase();if(q)a=a.filter(x=>[x.Description,x.Categorie,x.Compte,x.Type,Number(x.Montant||0).toFixed(2),String(Number(x.Montant||0)).replace('.',',')].some(v=>String(v||'').toLowerCase().includes(q)));if(ui.category!=="Toutes")a=a.filter(x=>x.Categorie===ui.category);if(ui.type!=="Tous")a=a.filter(x=>x.Type===ui.type);if(ui.cycle!=="Tous")a=a.filter(x=>x.Cycle===ui.cycle);if(ui.duplicateOnly)a=a.filter(x=>dups.has(x.id));a.sort((x,y)=>{let av=x[ui.sort],bv=y[ui.sort];if(ui.sort==='Montant'){av=Number(av);bv=Number(bv)}else{av=String(av||'').toLowerCase();bv=String(bv||'').toLowerCase()}return(av>bv?1:av<bv?-1:0)*(ui.sortDir==='asc'?1:-1)});return a}

function statementSummaryAmount(text,labels){
  const lines=String(text||'').split(/\r?\n/);
  for(const line of lines){
    const n=normDesc(line);
    if(!labels.some(label=>n.includes(label)))continue;
    const nums=line.match(/-?\s*\(?\$?\s*\d[\d\s,.]*[.,]\d{2}\)?/g)||[];
    for(let i=nums.length-1;i>=0;i--){
      const v=csvAmount(nums[i]);
      if(Number.isFinite(v))return Math.abs(v)
    }
  }
  return null
}
function validateStatementSummary(text,candidates=[]){
  const opening=statementSummaryAmount(text,['solde d ouverture','opening balance']);
  const deposits=statementSummaryAmount(text,['total des depots','total depots','total deposits','deposits total']);
  const withdrawals=statementSummaryAmount(text,['total des retraits','total retraits','total withdrawals','withdrawals total']);
  const closing=statementSummaryAmount(text,['solde de cloture','closing balance']);
  const found=[opening,deposits,withdrawals,closing].every(v=>Number.isFinite(v));
  if(!found)return {found:false,ok:true};

  const expected=opening+deposits-withdrawals;
  const equationDiff=Math.abs(expected-closing);
  const extractedDeposits=(candidates||[]).filter(x=>x.bankColumn==='Dépôt').reduce((sum,x)=>sum+Number(x.amount||0),0);
  const extractedWithdrawals=(candidates||[]).filter(x=>x.bankColumn==='Retrait').reduce((sum,x)=>sum+Number(x.amount||0),0);
  const depositsDiff=Math.abs(extractedDeposits-deposits);
  const withdrawalsDiff=Math.abs(extractedWithdrawals-withdrawals);

  return {
    found:true,opening,deposits,withdrawals,closing,expected,
    extractedDeposits,extractedWithdrawals,equationDiff,depositsDiff,withdrawalsDiff,
    equationOk:equationDiff<=.05,
    totalsOk:depositsDiff<=.05&&withdrawalsDiff<=.05,
    ok:equationDiff<=.05&&depositsDiff<=.05&&withdrawalsDiff<=.05
  }
}
function validateRunningBalances(candidates=[]){const rows=(candidates||[]).filter(x=>Number.isFinite(Number(x.runningBalance))&&x.bankColumn);let checked=0,mismatches=0;for(let i=1;i<rows.length;i++){const prev=rows[i-1],cur=rows[i];if(prev.accountName!==cur.accountName)continue;const expected=Number(prev.runningBalance)+(cur.bankColumn==='Dépôt'?Number(cur.amount):-Number(cur.amount));checked++;if(Math.abs(expected-Number(cur.runningBalance))>.05)mismatches++}return{checked,mismatches,ok:checked>0&&mismatches===0}}

ine mise à jour.</div>'}<button class="btn" style="margin-top:12px" data-action="review-resp">Mettre à jour le RESP</button>`}if(key==='visa'){const payments=(state.depenses||[]).filter(x=>x.Type==='Remboursement'&&normDesc(`${x.Description} ${x.Categorie}`).includes('visa')).sort((a,b)=>String(b.Date).localeCompare(String(a.Date)));return `<div class="summaryline"><span>Montant du relevé</span><strong>${money(c.visaStatement.base)}</strong></div><div class="summaryline"><span>Remboursements après mise à jour</span><strong>${money(c.visaStatement.paidAfter)}</strong></div><div class="summaryline total"><span>Reste à payer</span><strong>${money(c.visaOutstanding)}</strong></div>${c.visaStatement.dueDate?`<div class="goal-date">Échéance : ${dateFr(c.visaStatement.dueDate)}</div>`:''}${payments.length?`<div class="section-title" style="margin-top:14px">Paiements enregistrés</div>${detailListRows(payments)}`:''}`}return '<div class="empty">Aucun détail disponible.</div>'}

ass="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="modal-head"><h2>${title}</h2><button class="close" data-action="close-modal" aria-label="Fermer">×</button></div>${body}</div></div>`}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.activeTab=b.dataset.tab;ui.duplicateOnly=false;render();saveState()});
  document.querySelectorAll('[data-action]').forEach(b=>b.onclick=(e)=>action(b.dataset.action,e,b));
  document.querySelectorAll('[data-edit-expense]').forEach(x=>x.onclick=()=>openModal('expense',x.dataset.editExpense));
  document.querySelectorAll('[data-edit-income]').forEach(x=>x.onclick=()=>openModal('income',x.dataset.editIncome));
  document.querySelectorAll('[data-edit-envelope]').forEach(x=>x.onclick=()=>openModal('envelope',x.dataset.editEnvelope));
  document.querySelectorAll('[data-metric-detail]').forEach(x=>{x.onclick=()=>{ui.detailKey=x.dataset.metricDetail;openModal('metric-detail')};x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();ui.detailKey=x.dataset.metricDetail;openModal('metric-detail')}}});
  document.querySelectorAll('[data-review-edit]').forEach(x=>x.onclick=()=>openModal('expense',x.dataset.reviewEdit));
  document.querySelectorAll('[data-review-confirm]').forEach(x=>x.onclick=()=>{const row=state.depenses.find(v=>v.id===x.dataset.reviewConfirm);if(row){row.NeedsReview=false;row.ReviewedAt=new Date().toISOString();row.UpdatedAt=row.ReviewedAt;commit('Transaction confirmée')}});
  document.querySelectorAll('[data-review-income-edit]').forEach(x=>x.onclick=()=>openModal('income',x.dataset.reviewIncomeEdit));
  document.querySelectorAll('[data-review-income-confirm]').forEach(x=>x.onclick=()=>{
    const row=state.revenus.find(v=>v.id===x.dataset.reviewIncomeConfirm);
    if(row){row.NeedsReview=false;row.ReviewedAt=new Date().toISOString();row.UpdatedAt=row.ReviewedAt;commit('Revenu confirmé')}
  });
  document.querySelectorAll('[data-review-due-edit]').forEach(x=>x.onclick=()=>openModal('due',x.dataset.reviewDueEdit));
  document.querySelectorAll('[data-review-due]').forEach(x=>x.onclick=()=>openModal('due-review',x.dataset.reviewDue));
  document.querySelectorAll('[data-review-due-confirm]').forEach(x=>x.onclick=()=>{
    const due=state.echeancier.find(v=>v.id===x.dataset.reviewDueConfirm);
    if(!due)return;
    if(!due.Paiements||typeof due.Paiements!=='object')due.Paiements={};
    const now=new Date().toISOString();
    due.Paiements[state.selectedMonth]={...(due.Paiements[state.selectedMonth]||{}),manualPaid:true,reviewConfirmedAt:now,updatedAt:now};
    due.UpdatedAt=now;
    commit('Paiement manuel confirmé')
  });
  let draggedEnvelopeId=null,dropPosition='before';
  const clearEnvelopeInsertMarks=()=>{
    document.querySelectorAll('.envcard').forEach(c=>c.classList.remove('insert-before','insert-after'))
  };
  document.querySelectorAll('[data-envelope-drag]').forEach(handle=>{
    handle.addEventListener('dragstart',e=>{
      draggedEnvelopeId=handle.dataset.envelopeDrag;
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',draggedEnvelopeId);
      handle.closest('.envcard')?.classList.add('dragging')
    });
    handle.addEventListener('dragend',()=>{
      document.querySelectorAll('.envcard').forEach(c=>c.classList.remove('dragging','insert-before','insert-after'));
      draggedEnvelopeId=null;
      dropPosition='before'
    })
  });
  document.querySelectorAll('[data-envelope-card]').forEach(card=>{
    card.addEventListener('dragover',e=>{
      if(!draggedEnvelopeId||draggedEnvelopeId===card.dataset.envelopeCard)return;
      e.preventDefault();
      e.dataTransfer.dropEffect='move';

      clearEnvelopeInsertMarks();

      const rect=card.getBoundingClientRect(),
            midpoint=rect.top+rect.height/2;
      dropPosition=e.clientY<midpoint?'before':'after';
      card.classList.add(dropPosition==='before'?'insert-before':'insert-after')
    });

    card.addEventListener('dragleave',e=>{
      const rect=card.getBoundingClientRect();
      if(e.clientX<rect.left||e.clientX>rect.right||e.clientY<rect.top||e.clientY>rect.bottom){
        card.classList.remove('insert-before','insert-after')
      }
    });

    card.addEventListener('drop',e=>{
      e.preventDefault();

      const fromId=draggedEnvelopeId||e.dataTransfer.getData('text/plain'),
            targetId=card.dataset.envelopeCard;

      clearEnvelopeInsertMarks();

function setBankProgress(message,progress){ui.bank.message=message;ui.bank.progress=Math.max(0,Math.min(100,Number(progress)||0));const st=document.querySelector('#bankStatusText'),pt=document.querySelector('#bankProgressText'),bar=document.querySelector('#bankProgressBar');if(st)st.textContent=message;if(pt)pt.textContent=`${Math.round(ui.bank.progress)} %`;if(bar)bar.style.width=`${ui.bank.progress}%`}
async function analyseBankFiles(files){
  files=[...files].filter(isSupportedBankFile);if(!files.length)return toast('Aucun fichier bancaire reconnu (CSV, OFX, QFX, QBO, PDF ou image)','error');
  state.activeTab='bankimport';ui.bank.files=files.map(f=>f.name);ui.bank.candidates=[];ui.bank.rawText='';ui.bank.status='working';ui.bank.statementMonth=ui.bank.statementMonth||state.selectedMonth;render();setBankProgress(`Préparation de ${files.length} fichier${files.length>1?'s':''}…`,2);
  const all=[];try{
    for(let i=0;i<files.length;i++){
      const f=files[i],base=(i/files.length)*100,span=100/files.length;setBankProgress(`Analyse : ${f.name}`,base+3);
      let text='',parsed=[];if(/\.(csv)$/i.test(f.name)||f.type==='text/csv'){text=await f.text();parsed=parseBankCsv(text,f.name)}else if(/\.(ofx|qfx|qbo)$/i.test(f.name)){text=await f.text();parsed=parseBankOfx(text,f.name)}else if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){const pdfData=await extractPdfBankData(f,(p,m)=>setBankProgress(`${f.name} — ${m}`,base+p*span));text=pdfData.text;parsed=pdfData.candidates.length?pdfData.candidates:parseBankText(text,f.name)}else{text=await extractImageText(f,(p,m)=>setBankProgress(`${f.name} — ${m}`,base+p*span));parsed=parseBankText(text,f.name)}

    if(!ui.bank.candidates.length)toast('Aucune transaction détectée. Tu peux vérifier le texte brut extrait.','warn');else toast(`${ui.bank.candidates.length} transaction${ui.bank.candidates.length>1?'s':''} préparée${ui.bank.candidates.length>1?'s':''}`)
  }catch(err){console.error(err);ui.bank.status='error';setBankProgress(`Analyse impossible : ${err.message||'erreur inconnue'}`,0);toast('Impossible d’analyser ce fichier','error')}
}
async function extractPdfText(file,onProgress){
  await ensurePdfLib();
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjsLib.getDocument({data}).promise;let out=[];
  for(let p=1;p<=pdf.numPages;p++){
    onProgress?.((p-1)/pdf.numPages,`page ${p}/${pdf.numPages}`);const page=await pdf.getPage(p),content=await page.getTextContent(),lines=pdfTextLines(content.items);let text=lines.join('\n');
    if(text.replace(/\s/g,'').length<35){onProgress?.((p-.7)/pdf.numPages,`OCR page ${p}/${pdf.numPages}`);text=await ocrPdfPage(page,pct=>onProgress?.(((p-1)+pct)/pdf.numPages,`OCR page ${p}/${pdf.numPages}`))}
    out.push(text)
  }onProgress?.(1,'PDF terminé');return out.join('\n')

function pdfRawRows(items){
  const rows=[];
  for(const it of items){
    const txt=String(it.str||'').trim();
    if(!txt)continue;
    const y=Math.round((it.transform?.[5]||0)*2)/2;
    let row=rows.find(r=>Math.abs(r.y-y)<2);
    if(!row){row={y,items:[]};rows.push(row)}
    row.items.push({x:Number(it.transform?.[4]||0),s:txt});
  }
  rows.sort((a,b)=>b.y-a.y);
  for(const r of rows)r.items.sort((a,b)=>a.x-b.x);
  return rows
}
function rowPlainText(row){return (row?.items||[]).map(x=>x.s).join(' ').replace(/\s+/g,' ').trim()}
function nearestMoneyColumn(x,cols){
  const a=[['withdraw',cols.withdraw],['deposit',cols.deposit],['balance',cols.balance]].filter(v=>Number.isFinite(v[1]));
  if(!a.length)return'';
  a.sort((p,q)=>Math.abs(x-p[1])-Math.abs(x-q[1]));
  return a[0][0]
}
function rbcHeaderColumns(row){
  if(!row)return null;
  const findX=patterns=>{
    const hit=row.items.find(it=>patterns.some(p=>normDesc(it.s).includes(p)));
    return hit?hit.x:null
  };
  const withdraw=findX(['retraits','withdrawals']);
  const deposit=findX(['depots','deposits']);
  const balance=findX(['solde','balance']);
  if(!Number.isFinite(withdraw)||!Number.isFinite(deposit)||!Number.isFinite(balance))return null;
  return {withdraw,deposit,balance,leftLimit:Math.min(withdraw,deposit,balance)-18}
}
function classifyBankMovement(description,rawKind='expense',accountType=ui.bank.accountType){
  const n=normDesc(description);
  const visa=['visa-infinite','credit'].includes(accountType);

  if(visa){
    if(/payment received|payment thank|paiement recu|paiement reçu|credit balance|credit|refund|remboursement|reversal|return/.test(String(description||'').toLowerCase()))
      return {kind:'expense',type:'Remboursement',category:'Remboursement VISA'};
    return {kind:'expense',type:guessExpenseType(description),category:guessCategory(description,guessExpenseType(description))};
  }

  // Transfert explicitement envoyé vers un compte de dépôt / épargne :
  // il réduit le disponible mais n'est pas une dépense de consommation.
  if(/televirement au compte de depot|télévirement au compte de dépôt|transfer to deposit|transfer to savings|transfert vers epargne|transfert vers épargne/.test(String(description||'').toLowerCase()))
    return {kind:'expense',type:'Transfert',category:'Épargne - Transfert'};

  // Virement bancaire générique ou virement reçu : on ne l'invente ni comme revenu,
  // ni comme dépense du ménage. Il reste visible comme mouvement interne à vérifier.
  if(/virement par banque en direct|online banking transfer|virement recu|virement reçu|interac e-?transfer received|e-?transfer received/.test(String(description||'').toLowerCase()))
    return {kind:'transfer',type:'Transfert interne',category:'Transfert interne'};

  if(rawKind==='income')
    return {kind:'income',type:'',category:''};

  const type=guessExpenseType(description);
  return {kind:'expense',type,category:guessCategory(description,type)}
}
function parseRbcPdfItems(items,source,ctx={}){
  const rows=pdfRawRows(items);
  const headerIndex=rows.findIndex(r=>{
    const n=normDesc(rowPlainText(r));
    return (n.includes('retraits')||n.includes('withdrawals'))
      &&(n.includes('depots')||n.includes('deposits'))
      &&(n.includes('solde')||n.includes('balance'))
  });
  if(headerIndex<0)return {candidates:[],ctx};

  const cols=rbcHeaderColumns(rows[headerIndex]);
  if(!cols)return {candidates:[],ctx};

  let activeDate=ctx.activeDate||null;
  let pending=Array.isArray(ctx.pending)?ctx.pending:[];
  const out=[];

  for(let ri=headerIndex+1;ri<rows.length;ri++){
    const row=rows[ri];
    const whole=rowPlainText(row);
    const normalized=normDesc(whole);

    if(!whole)continue;
    if(/renseignements importants|important information/.test(normalized))break;
    if(/^rbpda\d+/i.test(normalized)||/^\*?\d{6,}\*?$/.test(normalized)){pending=[];continue}
    if(isBankStatementSummaryLine(whole)){pending=[];continue}

    const leftItems=row.items.filter(it=>it.x<cols.leftLimit);
    let left=leftItems.map(it=>it.s).join(' ').replace(/\s+/g,' ').trim();

    const d=extractDateFromLine(left);
    if(d){
      activeDate=d;
      left=left.replace(d.raw,' ').replace(/\s+/g,' ').trim()
    }

    const cellText={withdraw:'',deposit:'',balance:''};
    for(const it of row.items){
      if(it.x<cols.leftLimit)continue;
      const col=nearestMoneyColumn(it.x,cols);
      if(col)cellText[col]+=(cellText[col]?' ':'')+it.s
    }

    const withdrawal=Math.abs(csvAmount(cellText.withdraw)||0);
    const deposit=Math.abs(csvAmount(cellText.deposit)||0);
    const balanceValue=csvAmount(cellText.balance);
    const balance=Number.isFinite(balanceValue)?Math.abs(balanceValue):null;

    // Lignes de solde, pas des mouvements.
    if(!withdrawal&&!deposit){
      if(/solde d ouverture|solde d'ouverture|opening balance|solde de cloture|solde de clôture|closing balance/.test(normalized)){
        pending=[];
        continue
      }
      if(left)pending.push(left);
      if(pending.length>8)pending=pending.slice(-8);
      continue
    }

    if(!activeDate)continue;
    const date=normalizeBankDate(activeDate,ui.bank.statementMonth||state.selectedMonth);
    if(!date)continue;

    const description=[...pending,left].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    pending=[];
    if(!description||isHeaderOrTotal(description))continue;

    const amount=withdrawal||deposit;
    const rawKind=deposit>0?'income':'expense';
    const cls=classifyBankMovement(description,rawKind,ui.bank.accountType);

    out.push({
      include:true,
      date,
      description:description.slice(0,120),
      amount,
      kind:cls.kind,
      category:cls.category,
      type:cls.type,
      confidence:.995,
      source,
      accountName:ui.bank.accountName,
      bankColumn:deposit>0?'Dépôt':'Retrait',
      runningBalance:balance
    })
  }
  return {candidates:out,ctx:{activeDate,pending}}
}
async function extractPdfBankData(file,onProgress){
  await ensurePdfLib();
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const data=new Uint8Array(await file.arrayBuffer()),pdf=await pdfjsLib.getDocument({data}).promise;
  const textPages=[],candidates=[];
  let ctx={activeDate:null,pending:[]};

  for(let p=1;p<=pdf.numPages;p++){
    onProgress?.((p-1)/pdf.numPages,`page ${p}/${pdf.numPages}`);
    const page=await pdf.getPage(p),content=await page.getTextContent(),lines=pdfTextLines(content.items);
    let text=lines.join('\n');

    if(text.replace(/\s/g,'').length<35){
      onProgress?.((p-.7)/pdf.numPages,`OCR page ${p}/${pdf.numPages}`);
      text=await ocrPdfPage(page,pct=>onProgress?.(((p-1)+pct)/pdf.numPages,`OCR page ${p}/${pdf.numPages}`));
      // PDF scanné : garder le lecteur texte/OCR existant comme fallback.
    }else{
      const parsed=parseRbcPdfItems(content.items,file.name,ctx);
      ctx=parsed.ctx;
      candidates.push(...parsed.candidates)
    }
    textPages.push(text)
  }

  onProgress?.(1,'PDF terminé');
  return {text:textPages.join('\n'),candidates}
}
function pdfTextLines(items){
  const rows=[];for(const it of items){const y=Math.round((it.transform?.[5]||0)*2)/2;let row=rows.find(r=>Math.abs(r.y-y)<2);if(!row){row={y,items:[]};rows.push(row)}row.items.push({x:it.transform?.[4]||0,s:String(it.str||'')})}
  rows.sort((a,b)=>b.y-a.y);return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(v=>v.s).join(' ').replace(/\s+/g,' ').trim()).filter(Boolean)
}
async function ocrPdfPage(page,progress){const vp=page.getViewport({scale:1.8}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=Math.ceil(vp.width);canvas.height=Math.ceil(vp.height);await page.render({canvasContext:ctx,viewport:vp}).promise;return ocrImageSource(canvas,progress)}
async function extractImageText(file,onProgress){return ocrImageSource(file,p=>onProgress?.(p,'lecture OCR'))}
async function ocrImageSource(source,progress){
  await ensureOcrLib();
  const res=await Tesseract.recognize(source,'eng+fra',{logger:m=>{if(m.status==='recognizing text')progress?.(Math.max(0,Math.min(1,m.progress||0)))}});progress?.(1);return res?.data?.text||''
}

function parseDelimitedLine(line,delim){let out=[],cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur.trim());cur=''}else cur+=ch}out.push(cur.trim());return out}
function normalizeCsvHeader(s){return normDesc(s).replace(/\s+/g,' ')}
function csvAmount(v){if(v==null)return NaN;let s=String(v).trim().replace(/\$/g,'').replace(/\s/g,'');if(/^\(.*\)$/.test(s))s='-'+s.slice(1,-1);if(s.includes(',')&&s.includes('.')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');return Number(s)}
function normalizeLooseDate(v){v=String(v||'').trim();let d=extractDateFromLine(v);if(d)return normalizeBankDate(d,ui.bank.statementMonth||state.selectedMonth);const dt=new Date(v);if(!Number.isNaN(dt.getTime()))return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;return''}
function parseBankCsv(text,source){
  const raw=String(text||'').replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());
  if(raw.length<2)return parseBankText(text,source);
  const score=d=>(raw[0].split(d).length),delims=[',',';','\t','|'];
  let delim=delims.sort((a,b)=>score(b)-score(a))[0],headers=parseDelimitedLine(raw[0],delim),hn=headers.map(normalizeCsvHeader);
  const find=patterns=>hn.findIndex(h=>patterns.some(p=>h.includes(p)));
  const dateI=find(['date','transaction date','posting date','posted date']),
        descI=find(['description','details','merchant','payee','transaction','memo','name']),
        amountI=find(['amount','montant']),
        debitI=find(['debit','withdrawal','retrait','money out']),
        creditI=find(['credit','deposit','depot','money in']);
  if(dateI<0||descI<0||(amountI<0&&debitI<0&&creditI<0))return parseBankText(text,source);

  const out=[];
  for(let i=1;i<raw.length;i++){
    const row=parseDelimitedLine(raw[i],delim);
    if(row.length<2)continue;
    const date=normalizeLooseDate(row[dateI]),description=String(row[descI]||'').trim();
    if(!date||!description)continue;

    let amount=NaN,rawKind='expense';
    if(debitI>=0){
      const d=csvAmount(row[debitI]);
      if(Number.isFinite(d)&&Math.abs(d)>0){amount=Math.abs(d);rawKind='expense'}
    }
    if(creditI>=0){
      const c=csvAmount(row[creditI]);
      if(Number.isFinite(c)&&Math.abs(c)>0){amount=Math.abs(c);rawKind='income'}
    }
    if(!(amount>0)&&amountI>=0){
      const a=csvAmount(row[amountI]);
      if(Number.isFinite(a)&&a!==0){
        amount=Math.abs(a);
        rawKind=a<0?'expense':'income'
      }
    }
    if(!(amount>0))continue;

    const cls=classifyBankMovement(description,rawKind,ui.bank.accountType);
    out.push({
      include:true,date,description,amount,
      kind:cls.kind,category:cls.category,type:cls.type,
      confidence:.98,source,accountName:ui.bank.accountName
    })
  }
  return out
}
function ofxTag(block,tag){const m=String(block).match(new RegExp(`<${tag}>([^<\\r\\n]+)`,`i`));return m?m[1].trim():''}
function parseOfxDate(v){const m=String(v||'').match(/(20\d{2})(\d{2})(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:''}
function parseBankOfx(text,source){
  const blocks=String(text||'').match(/<STMTTRN>[\s\S]*?(?=<STMTTRN>|<\/BANKTRANLIST>|<\/CCSTMTRS>|$)/gi)||[],out=[];
  for(const b of blocks){
    const date=parseOfxDate(ofxTag(b,'DTPOSTED')||ofxTag(b,'DTUSER')),
          rawAmt=Number(ofxTag(b,'TRNAMT')),
          name=ofxTag(b,'NAME'),
          memo=ofxTag(b,'MEMO'),
          typeTag=ofxTag(b,'TRNTYPE'),
          description=[name,memo].filter(Boolean).join(' — ').replace(/\s+/g,' ').trim();
    if(!date||!description||!Number.isFinite(rawAmt)||rawAmt===0)continue;

    let rawKind=rawAmt>0?'income':'expense';
    if(/CREDIT|DEP|DIRECTDEP|INT/i.test(typeTag))rawKind='income';
    if(/DEBIT|CHECK|ATM|POS|FEE/i.test(typeTag))rawKind='expense';

    let cls=classifyBankMovement(description,rawKind,ui.bank.accountType);
    if(['credit','visa-infinite'].includes(ui.bank.accountType)&&/PAYMENT|CREDIT|REFUND/i.test(typeTag))
      cls={kind:'expense',type:'Remboursement',category:'Remboursement VISA'};

    out.push({
      include:true,date,description,amount:Math.abs(rawAmt),
      kind:cls.kind,category:cls.category,type:cls.type,
      confidence:.99,source,accountName:ui.bank.accountName
    })
  }
  return out.length?out:parseBankText(text,source)
}
function analysePastedBankText(text){text=String(text||'').trim();if(!text)return toast('Colle d’abord des transactions','error');const parsed=parseBankText(text,'Copier-coller bancaire');ui.bank.rawText=text;ui.bank.candidates=dedupeImportCandidates(parsed).map(x=>({...x,accountName:x.accountName||ui.bank.accountName,duplicate:isImportDuplicate(x),potentialDuplicate:isImportPotentialDuplicate(x)}));ui.bank.status='done';ui.bank.message=`${ui.bank.candidates.length} transaction${ui.bank.candidates.length>1?'s':''} détectée${ui.bank.candidates.length>1?'s':''}`;ui.bank.progress=100;render();if(!ui.bank.candidates.length)toast('Aucune ligne reconnue. Vérifie que chaque transaction contient une date et un montant.','warn');else toast(`${ui.bank.candidates.length} transaction${ui.bank.candidates.length>1?'s':''} préparée${ui.bank.candidates.length>1?'s':''}`)}

function parseBankText(text,source){
  // Lecteur commun au copier-coller, aux PDF et aux captures d'écran OCR.
  // Une date devient active ; les libellés sont mémorisés jusqu'au montant.
  const lines=String(text||'')
    .replace(/\u00a0/g,' ')
    .replace(/[−–—]/g,'-')
    .split(/\r?\n/)
    .map(x=>x.replace(/[|]/g,' ').replace(/\s+/g,' ').trim());

  const out=[];
  let activeDate=null;
  let pending=[];

  const emit=(dateObj,descriptionParts,amountLine)=>{
    if(!dateObj)return;

    const joined=[...descriptionParts,amountLine].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
    const amounts=extractMoneyValues(joined);
    if(!amounts.length)return;

    const picked=pickTransactionAmount(amounts,joined);
    if(!picked||!(picked.amount>0))return;

    const date=normalizeBankDate(dateObj,ui.bank.statementMonth||state.selectedMonth);
    if(!date)return;

    let desc=joined;
    if(dateObj.raw)desc=desc.replace(dateObj.raw,' ');
    for(const mv of extractMoneyValues(desc))desc=desc.replace(mv.raw,' ');
    desc=desc.replace(/\b(?:balance|solde)\b.*$/i,' ').replace(/\s+/g,' ').trim();
    desc=desc.replace(/^[-–—:]+|[-–—:]+$/g,'').trim().slice(0,120);

    if(desc.length<2||isHeaderOrTotal(desc))return;

    const guessedKind=guessKind(joined,picked.signed),
          cls=classifyBankMovement(joined,guessedKind,ui.bank.accountType),
          kind=cls.kind,
          type=cls.type,
          category=cls.category;

    let confidence=.9;
    if(dateObj.ambiguous)confidence-=.12;
    if(amounts.length>2)confidence-=.1;
    if(desc.length<4)confidence-=.15;
    if(/balance|solde/i.test(joined))confidence-=.08;

    out.push({
      include:true,
      date,
      description:desc,
      amount:picked.amount,
      kind,
      category,
      type,
      confidence:Math.max(.35,Math.min(.97,confidence)),
      source
    });
  };

  for(const rawLine of lines){
    // Les lignes vides sont ignorées, elles ne coupent plus une opération.
    if(!rawLine)continue;

    // Le sommaire du relevé n'est jamais une transaction.
    if(isBankStatementSummaryLine(rawLine)){
      pending=[];
      continue
    }

    const d=extractDateFromLine(rawLine);
    if(d){
      activeDate=d;
      pending=[];

      // Certaines extractions OCR mettent date + transaction sur la même ligne.
      const rest=rawLine.replace(d.raw,' ').replace(/\s+/g,' ').trim();
      if(rest){
        if(extractMoneyValues(rest).length){
          emit(activeDate,[],rest);
          pending=[];
        }else{
          pending.push(rest);
        }
      }
      continue;
    }

    if(!activeDate)continue;

    if(extractMoneyValues(rawLine).length){
      // Rattacher ce montant à toutes les lignes de libellé accumulées.
      emit(activeDate,pending,rawLine);
      pending=[];
    }else{
      pending.push(rawLine);
      if(pending.length>8)pending=pending.slice(-8);
    }
  }

  return out;
}
function extractDateFromLine(line){
  let m=line.match(/\b(20\d{2})[-\/.](0?[1-9]|1[0-2])[-\/.]([0-3]?\d)\b/);if(m)return{raw:m[0],y:+m[1],m:+m[2],d:+m[3],ambiguous:false};
  m=line.match(/\b(0?[1-9]|1[0-2])[\/-]([0-3]?\d)(?:[\/-](\d{2,4}))?\b/);if(m)return{raw:m[0],m:+m[1],d:+m[2],y:m[3]?normalizeYear(+m[3]):null,ambiguous:(+m[1]<=12&&+m[2]<=12)};
  m=line.match(/\b([0-3]?\d)[\/-](0?[1-9]|1[0-2])(?:[\/-](\d{2,4}))?\b/);if(m&&+m[1]>12)return{raw:m[0],d:+m[1],m:+m[2],y:m[3]?normalizeYear(+m[3]):null,ambiguous:false};
  const months={jan:1,january:1,janv:1,janvier:1,feb:2,february:2,fev:2,févr:2,fevrier:2,février:2,mar:3,march:3,mars:3,apr:4,april:4,avr:4,avril:4,may:5,mai:5,jun:6,june:6,juin:6,jul:7,july:7,juil:7,juillet:7,aug:8,august:8,aout:8,août:8,sep:9,sept:9,september:9,septembre:9,oct:10,october:10,octobre:10,nov:11,november:11,novembre:11,dec:12,december:12,decembre:12,décembre:12};
  m=line.match(/\b([A-Za-zÀ-ÿ]{3,10})\.?\s+([0-3]?\d)(?:,?\s+(20\d{2}))?\b/i);if(m&&months[m[1].toLowerCase().replace('.','')])return{raw:m[0],m:months[m[1].toLowerCase().replace('.','')],d:+m[2],y:m[3]?+m[3]:null,ambiguous:false};
  m=line.match(/\b([0-3]?\d)\s+([A-Za-zÀ-ÿ]{3,10})\.?(?:\s+(20\d{2}))?\b/i);if(m&&months[m[2].toLowerCase().replace('.','')])return{raw:m[0],d:+m[1],m:months[m[2].toLowerCase().replace('.','')],y:m[3]?+m[3]:null,ambiguous:false};return null
}
function normalizeYear(y){return y<100?2000+y:y}
function normalizeBankDate(d,statementMonth){const [sy,sm]=String(statementMonth||state.selectedMonth).split('-').map(Number);let y=d.y||sy,m=d.m,day=d.d;if(d.ambiguous&&sm===d.d&&sm!==d.m){m=d.d;day=d.m}if(!y||!m||!day)return'';const dt=new Date(y,m-1,day);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==day)return'';return`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function extractMoneyValues(line){const re=/(?:^|\s)([-+]?\s*(?:\$|CAD\s*)?\(?(?:\d{1,3}(?:[ ,]\d{3})+|\d+)(?:[.,]\d{2})\)?(?:\s*(?:CR|DR))?)(?=\s|$)/gi;let m,out=[];while((m=re.exec(' '+line+' '))){const raw=m[1].trim();let s=raw.replace(/CAD|\$|\s/gi,'');const cr=/CR$/i.test(s),dr=/DR$/i.test(s);s=s.replace(/(?:CR|DR)$/i,'');const par=/^\(.*\)$/.test(s);s=s.replace(/[()]/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/,/g,'');else if(s.includes(',')&&!s.includes('.'))s=s.replace(',','.');let v=parseFloat(s);if(!Number.isFinite(v))continue;if(par)v=-Math.abs(v);if(cr)v=-Math.abs(v);if(dr)v=Math.abs(v);out.push({raw,value:v})}return out}
function pickTransactionAmount(vals,line){if(!vals.length)return null;let idx=vals.length===1?0:vals.length-2;if(/credit card|visa|mastercard|amex/i.test(line)&&vals.length<=2)idx=vals.length-1;const v=vals[idx];return{raw:v.raw,amount:Math.abs(v.value),signed:v.value}}
function cleanBankDescription(line,dateRaw,amountRaw){let s=line.replace(dateRaw,' ');for(const mv of extractMoneyValues(s))s=s.replace(mv.raw,' ');s=s.replace(/\b(?:balance|solde)\b.*$/i,' ').replace(/\s+/g,' ').trim();s=s.replace(/^[-–—:]+|[-–—:]+$/g,'').trim();return s.slice(0,120)}
function isBankStatementSummaryLine(line){
  const n=String(line||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
  if(!n)return false;

  if(/sommaire de votre compte|summary of your account|details de l'activite du compte|renseignements importants sur votre compte/.test(n))return true;
  if(/^(date )?description retraits .*depots .*solde/.test(n))return true;
  if(/^du \d{1,2} [a-z]+ 20\d{2} au \d{1,2} [a-z]+ 20\d{2}$/.test(n))return true;

}
function isHeaderOrTotal(s){return isBankStatementSummaryLine(s)||/^(date|description|transactions?|withdrawals?|deposits?|debits?|credits?|balance|solde|total|opening balance|closing balance)$/i.test(s.trim())}
function guessKind(line,signed){const s=String(line||'').toLowerCase();if(['credit','visa-infinite'].includes(ui.bank.accountType))return'expense';if(/virement par banque en direct|online banking transfer|virement reçu|virement recu|interac e-?transfer received|e-?transfer received/.test(s))return'transfer';if(/payroll|salary|dépôt de paie|depot de paie|direct deposit|direct dep|credit memo|interest paid|refund received|government|gvt payment|prov\/?local gvt|paiement de gouv|paiement gouv|canada fed|benefit|ccb|acfb|ae canada|allocation canadienne|allocation.*canada/.test(s))return'income';if(signed<0&&/credit|deposit|refund|remboursement/.test(s))return'income';return'expense'}
function guessExpenseType(line){const s=String(line||'').toLowerCase();if(/télévirement au compte de dépôt|televirement au compte de depot|transfer to deposit|transfer to savings|transfert vers épargne|transfert vers epargne/.test(s))return'Transfert';if(/virement par banque en direct|online banking transfer|virement reçu|virement recu/.test(s))return'Transfert interne';if(/carma webrecurr|mainstreet equi|consumer loans/.test(s))return'Fixe';if(/payment received|payment thank|paiement reçu|paiement recu|credit balance|refund|remboursement|reversal|return/.test(s))return'Remboursement';if(/transfer to|transfert vers|savings|épargne/.test(s))return'Transfert';if(/rent|loyer|insurance|assurance|freedom mobile|rogers|telus|bell|netflix|spotify|disney|prime|loan|mortgage/.test(s))return'Fixe';return'Dépense'}
function guessCategory(line,type='Dépense'){
  const s=(' '+line+' ').toLowerCase();
  if(type==='Remboursement')return state.categories.includes('Remboursement VISA')?'Remboursement VISA':'Divers / À classer';
  if(type==='Transfert')return state.categories.includes('Épargne - Transfert')?'Épargne - Transfert':'Divers / À classer';
  if(type==='Transfert interne')return state.categories.includes('Transfert interne')?'Transfert interne':'Divers / À classer';

  const rules=[
    ['Santé',/pharmacy|pharmacie|drug mart|shoppers|rexall|dentist|dental|dentiste|doctor|médecin|medecin|clinic|clinique|medical|health|hospital|optomet|physio|chiropr/],
    ['Essence',/costco gas|shell|esso|petro|husky|centex|gas bar|fuel|gasoline/],
    ['Épicerie',/7 eleven|7-eleven|walmart|wal-mart|superstore|no frills|nofrills|safeway|save.on|costco|freshco|sobeys|co-op|coop|bulk barn|grocery|market/],
    ['Restaurant',/tim horton|starbucks|mcdonald|restaurant|doordash|skip ?the ?dishes|uber ?eats|wendy|subway|pizza|a&w/],
    ['Téléphones',/freedom mobile|rogers|telus|bell mobility|fido|koodo/],
    ['Abonnement',/netflix|spotify|disney|amazon prime|prime video|crave|youtube premium|icloud|google one/],
    ['Loyer',/mainstreet equi|rent|loyer|landlord/],
    ['Assurance auto',/primmum|auto insurance|car insurance|assurance auto|intact.*auto|ama insurance/],
    ['Assurance habitation',/home insurance|tenant insurance|assurance habitation/],
    ['Soccer Silas',/soccer|cmsa|foothills|villains fc|blizzard|west hills|southwest united/],
    ['Loisir / Sport',/sport|recreation|cineplex|movie|cinema|ymca|gym/],
    ['Vêtements',/winners|marshalls|old navy|h&m|zara|clothing|foot locker|sport chek/],
    ['Auto',/consumer loans|canadian tire.*auto|mechanic|tire|oil change|kal tire|midas|jiffy lube/],
    ['Maison',/carma webrecurr|dollarama|home depot|ikea|homesense|canadian tire|winners|amazon|temu/],
    ['Frais bancaires',/service charge|bank fee|monthly fee|frais mensuels|overdraft|nsf/]
  ];
  for(const [cat,re] of rules)if(re.test(s)&&state.categories.includes(cat))return cat;

function dedupeImportCandidates(arr){const seen=new Set();return arr.map(x=>{const k=`${x.date}|${normDesc(x.description)}|${Number(x.amount).toFixed(2)}`,batchDuplicate=seen.has(k);seen.add(k);return {...x,batchDuplicate,include:batchDuplicate?false:x.include!==false}})}
function normDesc(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
function isImportDuplicate(x){const nd=normDesc(x.description);if(x.kind==='income')return state.revenus.some(r=>String(r.ProchaineDate).slice(0,10)===x.date&&Math.abs(Number(r.Montant)-Number(x.amount))<.005&&normDesc(r.Source)===nd);return state.depenses.some(d=>String(d.Date).slice(0,10)===x.date&&Math.abs(Number(d.Montant)-Number(x.amount))<.005&&normDesc(d.Description)===nd)}
function isImportPotentialDuplicate(x){if(isImportDuplicate(x))return false;const nd=normDesc(x.description),tokens=new Set(nd.split(' ').filter(t=>t.length>3));return state.depenses.some(d=>{if(String(d.Date).slice(0,10)!==x.date||Math.abs(Number(d.Montant)-Number(x.amount))>=.005)return false;const od=normDesc(d.Description),other=new Set(od.split(' ').filter(t=>t.length>3)),common=[...tokens].filter(t=>other.has(t)).length;return common>=1&&(common/Math.max(1,Math.min(tokens.size,other.size)))>=.5})}
function refreshBankResults(){if(state.activeTab==='bankimport')render()}
function importBankCandidates(){
  const chosen=(ui.bank.candidates||[]).filter(x=>x.include!==false&&x.date&&Number(x.amount)>0);
  if(!chosen.length)return toast('Aucune transaction sélectionnée','error');

  const lineCheck=validateRunningBalances(ui.bank.candidates||[]);
  const summaryCheck=validateStatementSummary(ui.bank.rawText,ui.bank.candidates||[]);
  if((lineCheck.checked&&!lineCheck.ok)||(summaryCheck.found&&!summaryCheck.ok)){
    if(!confirm('Le contrôle du relevé détecte un écart. Certaines transactions ou certains montants peuvent manquer.\n\nVeux-tu quand même continuer l’import ?'))return
  }

  let expenses=0,incomes=0,skipped=0;

  for(const x of chosen){
    if(isImportDuplicate(x)){skipped++;continue}
    if(x.kind==='income'){
      state.revenus.push({
        id:uid('rev'),Source:x.description,Montant:Number(x.amount),
        Frequence:'Import bancaire',Jour:String(Number(x.date.slice(8,10))),
        ProchaineDate:x.date,Statut:'Reçu',Cycle:cycleForDate(x.date),
        Compte:x.accountName||ui.bank.accountName||'',
        CreatedAt:new Date().toISOString(),ImportedAt:new Date().toISOString(),
        ImportConfidence:Number(x.confidence||0),
        NeedsReview:Number(x.confidence||0)<.65,
        ReviewReason:Number(x.confidence||0)<.65?'Lecture bancaire à faible confiance':'',
        Note:`Importé depuis ${x.source||'relevé bancaire'}`
      });
      incomes++;
    }else{
      const type=x.kind==='transfer'?'Transfert interne':(x.type||'Dépense');
      const category=x.kind==='transfer'?'Transfert interne':(x.category||guessCategory(x.description,type));
      state.depenses.push({
        id:uid('dep'),Date:x.date,Description:x.description,Montant:Number(x.amount),
        Categorie:category,Compte:x.accountName||ui.bank.accountName||'Débit Sihem',
        Type:type,Direction:x.bankColumn||'',CreatedAt:new Date().toISOString(),ImportedAt:new Date().toISOString(),
        ImportConfidence:Number(x.confidence||0),
        NeedsReview:!!(x.potentialDuplicate||x.category==='Divers / À classer'||Number(x.confidence||0)<.65),
        ReviewReason:x.potentialDuplicate?'Doublon possible':(x.category==='Divers / À classer'?'Catégorie à confirmer':(Number(x.confidence||0)<.65?'Lecture bancaire à faible confiance':'')),
        Cycle:cycleForDate(x.date),Mois:monthOfDate(x.date)
      });
      expenses++;
    }
  }
  // Un relevé bancaire peut fournir un solde courant de fin de ligne.
  // On ne remplace jamais un solde manuel plus récent.
  state.accountBalances=state.accountBalances||{};
  for(const account of ['Débit Sihem','Débit Walid']){
    const rows=chosen.filter(x=>x.accountName===account&&Number.isFinite(Number(x.runningBalance))&&Number(x.runningBalance)>=0).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
    const last=rows.at(-1);
    if(last){
      const old=state.accountBalances[account]||{};
      if(!old.asOfDate||String(last.date)>=String(old.asOfDate)){
        const now=new Date().toISOString();state.accountBalances[account]={amount:Number(last.runningBalance),resetAt:now,verifiedAt:now,asOfDate:last.date,approximate:false,source:'Relevé bancaire'}
      }
    }
  }

  const months=[...new Set(chosen.map(x=>monthOfDate(x.date)).filter(Boolean))];
  if(months.length===1)state.selectedMonth=months[0];
  state.activeTab='depenses';
  ui.bank.candidates=[];
  ui.bank.rawText='';
  commit(`${expenses+incomes} transaction${expenses+incomes>1?'s':''} ajoutée${expenses+incomes>1?'s':''}${skipped?` • ${skipped} doublon${skipped>1?'s':''} ignoré${skipped>1?'s':''}`:''}`)
}
