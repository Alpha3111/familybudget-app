<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FamilyBudget Accounting V5</title></head><body><div id="status" style="font-family:system-ui;padding:30px">Chargement de FamilyBudget…</div><script>
(async()=>{try{const files=['payload-v5/p01.b64','payload-v5/p02.b64','payload-v5/p03.b64','payload-v5/p04.b64','payload-v5/p05.b64','payload-v5/p06.b64','payload-v5/p07.b64','payload-v5/p08.b64','payload-v5/p09.b64','payload-v5/p10.b64','payload-v5/p11.b64'];const pieces=[];for(const f of files){const r=await fetch(f+'?v=7',{cache:'no-store'});if(!r.ok)throw new Error(f+' : HTTP '+r.status);const txt=(await r.text()).replace(/[^A-Za-z0-9+/=]/g,'');if(!txt.length||txt.length%4!==0)throw new Error(f+' : fragment Base64 invalide ('+txt.length+' caractères après nettoyage)');let bin;try{bin=atob(txt)}catch(err){throw new Error(f+' : décodage Base64 impossible')};pieces.push(Uint8Array.from(bin,c=>c.charCodeAt(0)))}const total=pieces.reduce((n,p)=>n+p.length,0),bytes=new Uint8Array(total);let off=0;for(const p of pieces){bytes.set(p,off);off+=p.length}if(typeof DecompressionStream==='undefined')throw new Error('Navigateur incompatible avec DecompressionStream');let html;try{html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}catch(err){throw new Error('Payload compressé invalide : un fragment est probablement corrompu')};if(!html.includes('accountingModelV5'))throw new Error('La version Accounting V5 n’a pas été reconnue');document.open();document.write(html);document.close()}catch(e){console.error(e);document.getElementById('status').innerHTML='<h2>Erreur de chargement</h2><p>'+String(e.message||e)+'</p><p>Fais Ctrl+Shift+R. Si le message indique p01, p02… envoie-moi simplement ce numéro.</p>'}})();
</script></body></html>
